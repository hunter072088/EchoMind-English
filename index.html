        case 'moon':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>;

        case 'info':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;

          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}><circle cx="12" cy="12" r="10" /></svg>;

    // --- Smart Keyless Linguistic Engine (免金鑰智慧引擎 2.0) ---
    const SmartEngine = {
      // High reliability public translation (GTX + MyMemory dual-pipeline)
      async translate(text, from = 'zh-TW', to = 'en') {
        // 1. Try Google Translate public web API (fast, high precision)
        try {
          const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
          const res = await fetch(gtxUrl);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data?.[0])) {
              const fullText = data[0].map(item => item[0]).filter(Boolean).join('');
              if (fullText.trim()) return fullText.trim();
            }
          }
        } catch (e) {
          console.warn('GTX translation fallback:', e);
        }

        // 2. Try MyMemory API as fallback
        try {
          const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
          const res = await fetch(mmUrl);
          if (res.ok) {
            const data = await res.json();
            const translated = data?.responseData?.translatedText;
            if (translated && !translated.includes('MYMEMORY WARNING') && !translated.includes('QUERY LENGTH LIMIT')) {
              return translated.trim();
            }
          }
        } catch (e) {
          console.warn('MyMemory fallback:', e);
        }
        return null;
      },

      // Tab 1: 中翻英多維度情境擴充 (全新高品質語境重構引擎)
      async generateTab1(chinese) {
        let direct = await this.translate(chinese, 'zh-TW', 'en') || await this.translate(chinese, 'zh-CN', 'en');
        if (!direct) {
          direct = "Please review this item and get back to me as soon as possible.";
        }
        direct = direct.replace(/[。！]/g, '.').trim();

        const lowerZh = chinese.toLowerCase();
        let prof = direct;
        let casual = direct;
        let adv = direct;

        let profTip = '適用於職場正式信件、專案交辦與跨國商務溝通，語氣嚴謹得體、重視專業分寸。';
        let casualTip = '適用於日常聚會、朋友閒聊、Slack/Teams 內部非正式討論，親切自然無距離感。';
        let advTip = '適用於高階簡報、托福雅思高分寫作、公開演講，句型層次豐富、展現高級英語修養。';

        // 1. 請求、交付、請託情境 (Request / Favor / Deadline)
        if (chinese.includes('請') || chinese.includes('麻煩') || chinese.includes('交給') || chinese.includes('確認') || chinese.includes('儘快') || chinese.includes('回報')) {
          prof = direct.replace(/^(please|kindly)\s+/i, '')
                       .replace(/^(can you|could you)\s+/i, '');
          prof = `Could you kindly ensure that ${prof.charAt(0).toLowerCase() + prof.slice(1)}? Your prompt feedback would be greatly appreciated.`;
          prof = prof.replace(/contact me/gi, 'reach out to my attention')
                     .replace(/as soon as possible/gi, 'at your earliest convenience')
                     .replace(/questions/gi, 'inquiries or clarifications');

          casual = direct.replace(/^(please|kindly)\s+/i, '');
          casual = `Can you take a quick look and shoot this over to me? Let me know if anything pops up!`;
          casualTip = '以動詞片語「take a quick look」與「shoot over」取代死板直譯，在口語中極其道地。';

          adv = `I would be exceedingly grateful if you could attend to this matter at your earliest convenience; please touch base should any bottleneck arise.`;
          advTip = '運用假定語氣「I would be grateful if...」與成語片語「touch base」，展現典雅洗鍊的高階風範。';
        }
        // 2. 意見、提案、想法情境 (Opinion / Suggestion)
        else if (chinese.includes('認為') || chinese.includes('覺得') || chinese.includes('建議') || chinese.includes('方案') || chinese.includes('想法')) {
          prof = `From a strategic perspective, we believe this proposal presents a viable and robust course of action.`;
          profTip = '以「From a strategic perspective」開頭，賦予提案商業格局與說服力。';

          casual = `Honestly, I really feel like this idea is the way to go for us!`;
          casualTip = '使用「the way to go」，在母語者口語中是表達「這是最佳選擇」最生動自然的說法。';

          adv = `Compelling evidence substantiates this methodology as the most optimal solution to our current objectives.`;
          advTip = '以「Compelling evidence substantiates」強調論證的嚴密與不可動搖性。';
        }
        // 3. 狀態報告、已完成、確認情境 (Status / Completed)
        else if (chinese.includes('已經') || chinese.includes('完成') || chinese.includes('做好') || chinese.includes('進度') || chinese.includes('成功')) {
          prof = `Please be advised that all associated deliverables have been successfully finalized in full alignment with our timeline.`;
          profTip = '商務公文標準開頭「Please be advised that」，適合對主管或客戶進行進度確認。';

          casual = `We're pretty much all set with this—everything wrapped up right on schedule!`;
          casualTip = '口語慣用語「all set」與「wrapped up」，傳遞事情圓滿解決的輕鬆俐落感。';

          adv = `All milestones have been brought to full fruition in strict accordance with our established benchmarks.`;
          advTip = '典雅片語「brought to fruition」意為「開花結果、圓滿落實」，寫作演講評分極高。';
        }
        // 4. 一般語句的智慧修飾
        else {
          prof = direct.replace(/want to/gi, 'intend to')
                       .replace(/need to/gi, 'are required to')
                       .replace(/very good/gi, 'highly commendable')
                       .replace(/big problem/gi, 'substantial challenge')
                       .replace(/help/gi, 'assist');
          if (!prof.startsWith('Please') && !prof.startsWith('Kindly') && !prof.startsWith('We')) {
            prof = `Kindly note that ${prof.charAt(0).toLowerCase() + prof.slice(1)}`;
          }

          casual = direct.replace(/I would like to/gi, "I'd love to")
                         .replace(/do not/gi, "don't")
                         .replace(/cannot/gi, "can't")
                         .replace(/very/gi, "super")
                         .replace(/good/gi, "solid");
          if (!casual.endsWith('!') && !casual.endsWith('?')) casual = `${casual}!`;

          adv = `It is worth emphasizing that ${direct.charAt(0).toLowerCase() + direct.slice(1).replace(/\.$/, '')}, which warrants thorough consideration.`;
        }

        return {
          direct_translation: direct,
          scenarios: {
            professional: prof,
            professional_tip: profTip,
            casual: casual,
            casual_tip: casualTip,
            advanced: adv,
            advanced_tip: advTip
          },
          analysis: `【多維度語感深度解析】\n1. 💼 商務/正式 (Formal)：擺脫單字生硬直譯，採用職場得體的被動或假設句構，重視指令分寸與對受話者的尊重。\n2. 💬 道地口語 (Casual)：善用母語人士高頻的動詞片語（Phrasal Verbs）與縮寫，節奏俐落流暢，拉近溝通距離。\n3. ✨ 進階精煉 (Idiomatic)：運用結構層次豐富的複合金句與精準搭配詞（Collocations），無論在托福雅思寫作或高階商務演說中皆能展現深厚底蘊。`
        };
      },

      // Tab 2: 英翻中與母語潤飾 (深度台式英文與文法診斷庫)
      async generateTab2(english) {
        let zh = await this.translate(english, 'en', 'zh-TW');
        if (!zh) {
          zh = "這是一句值得深入學習與潤飾的實用英文句子。";
        }

        const rules = [
          { pat: /\bvery like\b/i, rep: 'really like', issue: '台式英文 (Chinglish)：英文中副詞 very 不能直接修飾普通動詞 like，應使用「really like」或「like ... very much」。' },
          { pat: /\b(i am|i'm) agree\b/i, rep: 'I agree', issue: '文法錯誤：agree 本身即為動詞，不可加 be 動詞，應說「I agree」。' },
          { pat: /\bopen the light\b/i, rep: 'turn on the light', issue: '用字錯誤：開電燈應用動詞片語「turn on」，open 用於打開物理門窗或書籍。' },
          { pat: /\bclose the light\b/i, rep: 'turn off the light', issue: '用字錯誤：關電燈應用「turn off」，不可直譯為 close。' },
          { pat: /\blearn much\b/i, rep: 'learn a lot', issue: '搭配不自然：修飾學習收穫量時，母語人士習慣使用「learn a lot」或「gain substantial insights」。' },
          { pat: /\bfeel very challenge\b/i, rep: 'feel challenged', issue: '詞性錯誤：challenge 是名詞或動詞，表達感到挑戰應使用分詞形容詞「challenged」或主動句「it challenges me」。' },
          { pat: /\bit make\b/i, rep: 'it makes', issue: '主詞動詞一致性：單數第三人稱 it 後方一般動詞應加 s 為「makes」。' },
          { pat: /\bcost me much money\b/i, rep: 'cost a fortune', issue: '中式思維：表達花很多錢，母語人士更常用生動的「cost a fortune」或「cost a pretty penny」。' },

    // --- Sub-Component: Blind Listening & Dictation Box Component ---
    function BlindSentenceBox({ sentence, blindMode, onPlay, highlightWord }) {
      const [revealed, setRevealed] = useState(false);
      const [dictationInput, setDictationInput] = useState('');
      const [checkResult, setCheckResult] = useState(null);

      useEffect(() => {
        if (!blindMode) {
          setRevealed(false);
          setCheckResult(null);
        }
      }, [blindMode]);

      const renderSentenceText = () => {
        if (!highlightWord) {
          const parts = sentence.split(/(\*\*.*?\*\*)/g);
          return parts.map((part, i) => {
            if (part.startsWith('**') && part.endsWith('**')) {
              return <strong key={i} className="text-brand-600 dark:text-brand-400 font-bold">{part.slice(2, -2)}</strong>;
            }
            return part;
          });
        }

        const regex = new RegExp(`(${highlightWord})`, 'gi');
        const parts = sentence.split(regex);
        return parts.map((part, i) => (
          regex.test(part) ? (
            <strong key={i} className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950/60 px-1 rounded">
              {part}
            </strong>
          ) : part
        ));
      };

      const handleCheckDictation = () => {
        if (!dictationInput.trim()) return;

        const normalize = (str) =>
          str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);

        const targetWords = normalize(sentence);
        const userWords = normalize(dictationInput);

        if (targetWords.length === 0) return;

        let matches = 0;
        const diff = [];
        let uIdx = 0;

        targetWords.forEach((word) => {
          if (uIdx < userWords.length && userWords[uIdx] === word) {
            matches++;
            diff.push({ word, status: 'correct' });
            uIdx++;
          } else {
            diff.push({ word, status: 'missing' });
          }
        });

        const accuracy = Math.round((matches / targetWords.length) * 100);
        setCheckResult({ accuracy, diff });
      };

      if (!blindMode) {
        return (
          <p className="text-base sm:text-lg font-medium text-slate-800 dark:text-slate-100 leading-relaxed font-sans">
            {renderSentenceText()}
          </p>
        );
      }

      return (
        <div className="space-y-3">
          <div className="relative p-4 rounded-xl bg-slate-100/70 dark:bg-slate-900/70 border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <p className={`text-base sm:text-lg font-medium text-slate-800 dark:text-slate-100 leading-relaxed blind-blur ${revealed ? 'revealed' : ''}`}>
              {renderSentenceText()}
            </p>

            {!revealed && (
              <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/10 backdrop-blur-[6px] p-2 text-center">
                <span className="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1 flex items-center gap-1.5">
                  <span>🎧 原文已遮蔽（聽力聽寫訓練中）</span>
                </span>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">
                  先聽發音，在下方輸入聽寫，完成後揭曉答案！
                </p>
              </div>
            )}
          </div>

          <div className="space-y-2">
            <div className="flex gap-2">
              <input
                type="text"
                value={dictationInput}
                onChange={(e) => setDictationInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    handleCheckDictation();
                  }
                }}
                placeholder="在此輸入您聽到的英文句子..."
                className="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 focus:outline-none"
              />
              <button
                type="button"
                onClick={handleCheckDictation}
                className="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold shadow-xs"
              >
                比對
              </button>
              <button
                type="button"
                onClick={() => setRevealed(!revealed)}
                className="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold"
              >
                {revealed ? '再次遮蔽' : '揭曉原文'}
              </button>
            </div>

            {checkResult && (
              <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs space-y-1.5 animate-fadeIn">
                <div className="flex items-center justify-between font-bold">
                  <span className={checkResult.accuracy >= 80 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}>
                    🎯 聽寫準確率：{checkResult.accuracy}%
                  </span>
                  <span className="text-slate-400 font-normal">
                    {checkResult.accuracy === 100 ? '太神了！完全聽對！🎉' : '點擊「揭曉原文」對照漏聽單字'}
                  </span>
                </div>
                <div className="flex flex-wrap gap-1 pt-1">
                  {checkResult.diff.map((item, idx) => (
                    <span
                      key={idx}
                      className={`px-1.5 py-0.5 rounded text-[11px] font-mono ${
                        item.status === 'correct'
                          ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
                          : 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 line-through'
                      }`}
                    >
                      {item.word}
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

      const [modeInput, setModeInput] = useState(engineMode);

      const [modelInput, setModelInput] = useState(selectedModel);
      const [rateInput, setRateInput] = useState(speechRate);
      const [accentInput, setAccentInput] = useState(speechAccent);
      const [showKey, setShowKey] = useState(false);
      const [isTestingApi, setIsTestingApi] = useState(false);
      const [testApiResult, setTestApiResult] = useState(null);

      // Available models dynamically detected or preset
      const [availableModelsList, setAvailableModelsList] = useState([
        { id: 'gemini-2.0-flash', name: 'Gemini 2.0 Flash（推薦：最新次世代極速模型，配額充裕）' },
        { id: 'gemini-1.5-flash-latest', name: 'Gemini 1.5 Flash Latest（穩健高配額版）' },
        { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash（最新推理強化版）' },
        { id: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro（深度複雜推理）' }
      ]);

      // Detect and Test Models
      const handleDetectAndTestModels = async () => {
        if (!keyInput.trim()) {
          setTestApiResult({ ok: false, msg: '請先輸入 API Key 再進行偵測！' });
          return;
        }

        setIsTestingApi(true);
        setTestApiResult(null);

        const cleanKey = keyInput.trim();
        let detected = [];
        let detectedVersion = 'v1beta';

        try {
          // 1. Try querying models list from v1beta
          let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${cleanKey}`);
          if (!res.ok) {
            // Try v1
            res = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${cleanKey}`);
            if (res.ok) detectedVersion = 'v1';
          }

          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data.models)) {
              detected = data.models
                .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
                .map(m => {
                  const id = m.name.replace(/^models\//, '');
                  let label = m.displayName || id;
                  if (id.includes('2.0-flash')) label += ' ⭐ (推薦最新極速)';
                  else if (id.includes('1.5-flash')) label += ' (高相容穩健)';
                  return { id, name: `${label} [${id}]` };
                });
            }
          }

          if (detected.length > 0) {
            setAvailableModelsList(detected);
            const hasCurrent = detected.some(m => m.id === modelInput.replace(/^models\//, ''));
            if (!hasCurrent) {
              const best = detected.find(m => m.id.includes('2.0-flash')) || detected[0];
              setModelInput(best.id);
            }
            setTestApiResult({
              ok: true,
              msg: `✅ 驗證成功！已透過 ${detectedVersion} 偵測到您帳號支援的 ${detected.length} 個模型，已自動為您選定可用模型！`
            });
            return;
          }

          // If models list couldn't be queried directly, test generateContent with candidate models
          const testModels = ['gemini-2.0-flash', 'gemini-1.5-flash-latest', 'gemini-2.5-flash', 'gemini-1.5-flash'];
          let testedModel = null;

          for (const mName of testModels) {
            for (const v of ['v1beta', 'v1']) {
              try {
                const testRes = await fetch(`https://generativelanguage.googleapis.com/${v}/models/${mName}:generateContent?key=${cleanKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: "Hi" }] }],
                    generationConfig: { maxOutputTokens: 2 }
                  })
                });
                if (testRes.ok) {
                  testedModel = mName;
                  break;
                }
              } catch (_) {}
            }
            if (testedModel) break;
          }

          if (testedModel) {
            setModelInput(testedModel);
            setTestApiResult({
              ok: true,
              msg: `✅ 連線成功！已自動為您驗證並套用有效模型：${testedModel}`
            });
          } else {
            throw new Error('無法連線至 Gemini 模型，請檢查 API Key 是否正確或是否有專案存取權限。');
          }

        } catch (err) {
          setTestApiResult({
            ok: false,
            msg: `連線失敗：${err.message}。若持續失敗，可隨時無縫切換免金鑰模式！`
          });
        } finally {
          setIsTestingApi(false);
        }
      };

            </div>

            <div className="space-y-4 text-xs sm:text-sm">
              
              {/* 1. Mode Switcher (Smart Keyless vs Gemini API) */}

                <label className="font-bold text-slate-800 dark:text-slate-200 block mb-2">
                  學習引擎模式 (選擇你想使用的方式)
                </label>
                <div className="grid grid-cols-2 gap-2.5">
                  <button
                    type="button"
                    onClick={() => setModeInput('smart')}

                      modeInput === 'smart'

                        : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-1.5 font-bold text-xs sm:text-sm text-emerald-700 dark:text-emerald-300">

      onClose,
      onSelectItem,
      onToggleStar,
      onClearHistory,
      onExportMarkdown,
      onExportJson
    }) {
      const [view, setView] = useState('favorites'); // 'favorites' | 'history'

      const currentList = view === 'favorites' ? favorites : history;

      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/40 backdrop-blur-xs animate-fadeIn">
          <div className="glass-card w-full max-w-md h-full border-l border-slate-200 dark:border-slate-800 p-5 shadow-2xl flex flex-col justify-between">
            <div>
              <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
                <div className="flex items-center gap-2">
                  <span className="p-2 rounded-xl bg-amber-100 text-amber-600 dark:bg-amber-950 dark:text-amber-400">
                    <Icon name="bookmark" className="w-5 h-5" />
                  </span>
                  <h3 className="font-display font-bold text-lg text-slate-900 dark:text-white">
                    學習庫存與歷史
                  </h3>
                </div>
                <button onClick={onClose} className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                  <Icon name="x" className="w-5 h-5" />
                </button>
              </div>

              {/* Toggle Favorites vs History */}
              <div className="flex gap-2 my-4 p-1 rounded-xl bg-slate-100 dark:bg-slate-900 text-xs font-semibold">
                <button
                  onClick={() => setView('favorites')}
                  className={`flex-1 py-1.5 rounded-lg transition ${
                    view === 'favorites'
                      ? 'bg-white dark:bg-slate-800 text-amber-600 dark:text-amber-400 shadow-xs'
                      : 'text-slate-500'
                  }`}
                >
                  ⭐ 精選收藏 ({favorites.length})
                </button>
                <button
                  onClick={() => setView('history')}
                  className={`flex-1 py-1.5 rounded-lg transition ${
                    view === 'history'
                      ? 'bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-400 shadow-xs'
                      : 'text-slate-500'
                  }`}
                >
                  🕒 歷史足跡 ({history.length})
                </button>
              </div>

              {/* Items List */}
              <div className="space-y-3 overflow-y-auto max-h-[calc(100vh-250px)] pr-1">
                {currentList.length === 0 ? (
                  <div className="py-12 text-center text-slate-400 text-xs">
                    <span>{view === 'favorites' ? '目前尚無收藏項目，可點擊星號加入收藏 ⭐' : '尚無歷史紀錄'}</span>
                  </div>
                ) : (
                  currentList.map((item) => (
                    <div
                      key={item.id}
                      className="p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 hover:border-brand-300 dark:hover:border-brand-700 transition flex items-start justify-between gap-3 group"
                    >
                      <div className="flex-1 cursor-pointer" onClick={() => onSelectItem(item)}>
                        <div className="flex items-center gap-1.5 mb-1">
                          <span className="text-[10px] px-2 py-0.5 rounded-full font-semibold bg-slate-100 dark:bg-slate-800 text-slate-500">
                            {item.tab === 'tab1' ? '中翻英擴充' : item.tab === 'tab2' ? '英翻中潤飾' : '單字練習'}
                          </span>
                        </div>
                        <p className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-2">
                          {item.input}
                        </p>
                      </div>

                      <button
                        onClick={() => onToggleStar(item)}
                        className="p-1 text-slate-400 hover:text-amber-500"
                        title="切換收藏狀態"
                      >
                        <Icon name={favorites.some(f => f.input === item.input && f.tab === item.tab) ? 'star' : 'star-outline'} className="w-4 h-4 text-amber-500" />
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>

            {/* Bottom Actions */}
            <div className="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={onExportMarkdown}
                  className="w-full py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs flex items-center justify-center gap-1.5 transition"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>匯出 MD 筆記</span>
                </button>

                <button
                  onClick={onExportJson}
                  className="w-full py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold text-xs flex items-center justify-center gap-1.5 transition"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>JSON 備份</span>
                </button>
              </div>

              {view === 'history' && history.length > 0 && (
                <button
                  onClick={onClearHistory}
                  className="w-full py-1.5 text-center text-xs text-red-500 hover:text-red-700 transition flex items-center justify-center gap-1"
                >
                  <Icon name="trash" className="w-3.5 h-3.5" />
                  <span>清空所有歷史紀錄</span>
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    // --- Render Application Root ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
