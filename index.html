        case 'pause':

        case 'sun':

        case 'x':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>;
        case 'info':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case 'key':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>;
        case 'arrow-right':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2} {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>;
        default:
          return null;
      }
    };

    // --- High Quality Preset Quick Samples for Testing ---
    const SAMPLE_DATA = {
      tab1: {
        prompt: "這份企劃書請在明天下午三點前交給我，若有任何問題隨時與我聯繫。",
        data: {
          direct_translation: "Please submit this proposal to me before 3:00 PM tomorrow, and feel free to contact me if you have any questions.",
          scenarios: {
            professional: "Kindly ensure that this proposal is submitted to me no later than 3:00 PM tomorrow. Please do not hesitate to reach out should you encounter any inquiries or require clarification.",
            casual: "Can you send over this proposal by 3 PM tomorrow? Let me know anytime if anything comes up!",
            advanced: "I would appreciate receiving the finalized proposal by 15:00 tomorrow; please feel free to loop back with me on any bottlenecks or queries."
          },
          analysis: "在商務情境中，使用「Kindly ensure」比單純的「Please」更具得體的指令威嚴；而「do not hesitate to reach out」是職場信件標準且親切的收尾表達。在口語中，動詞片語「send over」與「comes up」能使語句自然生動。"
        }
      },
      tab2: {
        prompt: "I very like this project because it make me feel very challenge and learn much.",
        data: {
          translation: "我非常喜歡這個專案，因為它讓我感到充滿挑戰，且收穫良多。",
          grammar_polish: {
            original: "I very like this project because it make me feel very challenge and learn much.",
            corrected: "I really like this project because it challenges me and helps me learn a lot.",
            issues: [
              "台式英文 (Chinglish)：英文中不可說「very like」，副詞 very 不能直接修飾普通動詞 like，應使用「really like」或「like ... very much」。",
              "主詞動名詞單複數一致性：it 為單數第三人稱，其後動詞應為「makes」而非「make」。",
              "詞性誤用：challenge 本身可作及物動詞或名詞，或使用形容詞「challenging」，不能說「feel very challenge」。",

            ],
            explanation: "修飾動詞喜好程度時，母語者最常用「really like」；將「make me feel challenge」簡化為主動動詞「it challenges me」，句意更加精準有力。"
          },
          alternatives: {
            polite: "I genuinely appreciate this initiative, as it offers both a healthy challenge and a tremendous learning opportunity.",
            direct: "I enjoy working on this project—it pushes my boundaries and accelerates my learning.",

      },
      tab3: {
        prompt: "serendipity",
        data: {
          deconstruction: {

          contexts: [

            },
            {

              sentence_en: "The archaeologist credited sheer **serendipity** for unearthing the millennia-old submerged temple.",

            },
            {

              sentence_en: "Penicillin is classic evidence of scientific **serendipity**, where careful observation turned contamination into discovery.",
              sentence_zh: "青黴素是科學界機緣巧合的經典例證：細緻入微的觀察將培養皿污染轉化成了劃時代的發現。",
              tip: "學術界常用來探討科學家如何「抓住意外之美」，區別於單純盲目的運氣。"

    };

    // --- Main Application Component ---
    function App() {
      // Configuration & Keys
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
      const [selectedModel, setSelectedModel] = useState(() => localStorage.getItem('gemini_model') || 'gemini-1.5-flash');
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem('app_theme');
        return saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      // Global Modes
      const [activeTab, setActiveTab] = useState('tab1'); // 'tab1' | 'tab2' | 'tab3'
      const [blindMode, setBlindMode] = useState(false); // 👁️ 盲聽練習模式
      const [speechRate, setSpeechRate] = useState(1.0); // 0.8, 1.0, 1.2
      const [speechAccent, setSpeechAccent] = useState('en-US'); // 'en-US' | 'en-GB'

      // Input State
      const [inputText, setInputText] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');

      // Results
      const [resultData, setResultData] = useState(null);

      // Speech State
      const [playingSentence, setPlayingSentence] = useState(null);
      const [availableVoices, setAvailableVoices] = useState([]);

      // Favorites & History
      const [history, setHistory] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('english_studio_history') || '[]');
        } catch {
          return [];
        }
      });
      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('english_studio_favorites') || '[]');
        } catch {
          return [];
        }
      });
      const [sidebarTab, setSidebarTab] = useState('favorites'); // 'favorites' | 'history'
      const [searchQuery, setSearchQuery] = useState('');

      // Toast Notification
      const [toast, setToast] = useState(null);
      const showToast = useCallback((msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      }, []);

      // Theme toggle effect
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('app_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('app_theme', 'light');
        }
      }, [darkMode]);

      // Save History and Favorites to LocalStorage
      useEffect(() => {
        localStorage.setItem('english_studio_history', JSON.stringify(history.slice(0, 60)));
      }, [history]);

      useEffect(() => {
        localStorage.setItem('english_studio_favorites', JSON.stringify(favorites));
      }, [favorites]);

      // Initialize Speech Synthesis Voices
      useEffect(() => {
        if (!('speechSynthesis' in window)) return;
        const updateVoices = () => {
          const voices = window.speechSynthesis.getVoices();
          setAvailableVoices(voices);
        };
        updateVoices();
        window.speechSynthesis.onvoiceschanged = updateVoices;
        return () => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
        };
      }, []);

      // Speech Synthesis Utterance Function
      const playSpeech = useCallback((text, customAccent, customRate) => {
        if (!('speechSynthesis' in window)) {
          showToast('您的瀏覽器不支援 Web Speech API 語音發音', 'error');
          return;
        }

        const rate = customRate !== undefined ? customRate : speechRate;
        const accent = customAccent || speechAccent;

        // Cancel previous speech
        window.speechSynthesis.cancel();

        // Clean out markdown asterisks or code formatting
        const cleanText = text.replace(/[*_#`~[\]]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = rate;
        utterance.pitch = 1.0;

        // Intelligent voice matching
        const voices = availableVoices.length > 0 ? availableVoices : window.speechSynthesis.getVoices();
        const targetLang = accent === 'en-GB' ? 'en-GB' : 'en-US';

        const matchedVoice = voices.find(v => (v.lang.replace('_', '-') === targetLang) &&
          (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Jenny') || v.name.includes('Oliver')))
          || voices.find(v => v.lang.replace('_', '-') === targetLang)
          || voices.find(v => v.lang.replace('_', '-').startsWith(targetLang.split('-')[0]))
          || null;

        if (matchedVoice) {
          utterance.voice = matchedVoice;
        }
        utterance.lang = targetLang;

        utterance.onstart = () => {
          setPlayingSentence(text);
        };
        utterance.onend = () => {
          setPlayingSentence(null);
        };
        utterance.onerror = () => {
          setPlayingSentence(null);
        };

        window.speechSynthesis.speak(utterance);
      }, [speechRate, speechAccent, availableVoices, showToast]);

      const stopSpeech = useCallback(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setPlayingSentence(null);
        }
      }, []);

      // Gemini API Request Function
      const handleGenerate = async (presetInput = null) => {
        const queryText = presetInput || inputText.trim();
        if (!queryText) {
          setErrorMessage('請先輸入內容再開始生成！');
          return;
        }

        setErrorMessage('');
        setIsLoading(true);
        stopSpeech();

You MUST respond with STRICT valid JSON matching this exact schema:
{
  "direct_translation": "Standard accurate English translation",

}`;
          userPrompt = `請將以下中文內容進行專業多維度翻譯擴充，並輸出標準 JSON：
"${queryText}"`;
        } else if (activeTab === 'tab2') {
          systemPrompt = `You are an elite bilingual English editor and native writing coach. The user gives you an English sentence they wrote.
You MUST respond with STRICT valid JSON matching this exact schema:
{
  "translation": "Accurate Traditional Chinese (繁體中文) translation",
  "grammar_polish": {
    "original": "The user's original sentence",

    "explanation": "Traditional Chinese comprehensive explanation on why the change was made and native writing intuition"
  },
  "alternatives": {
    "polite": "Diplomatic, polite and thoughtful rephrasing",
    "direct": "Direct, crisp, assertive and decisive rephrasing",
    "idiomatic": "Highly idiomatic, native colloquial expression or proverb"
  }
}`;
          userPrompt = `請審核並潤飾以下英文句子，找出文法錯誤與不自然之處，並輸出標準 JSON：
"${queryText}"`;
        } else if (activeTab === 'tab3') {
          systemPrompt = `You are an expert lexicographer and English vocabulary mentor. The user provides one or more English words.
You MUST respond with STRICT valid JSON matching this exact schema:
{
  "deconstruction": {
    "word": "The target word",
    "ipa": "KK phonetic or IPA notation like /ˌser.ənˈdɪp.ə.ti/",
    "part_of_speech": "e.g. noun, verb, adj.",
    "definition_zh": "Core Traditional Chinese (繁體中文) definition",
    "memory_hook": "Root/Prefix/Suffix etymology OR mnemonic memory hook in Traditional Chinese"
  },
  "contexts": [
    {
      "category": "日常社交 (Daily Social)",
      "sentence_en": "Natural English sentence with the target word highlighted with double asterisks e.g. **word**",
      "sentence_zh": "Traditional Chinese translation",
      "tip": "Traditional Chinese practical usage tip or collocations"
    },
    {
      "category": "職場溝通 (Workplace / Business)",
      "sentence_en": "Workplace English sentence with **word**",
      "sentence_zh": "Traditional Chinese translation",
      "tip": "Practical usage tip in business context"
    },
    {
      "category": "新聞時事 (News / Current Affairs)",
      "sentence_en": "Journalistic English sentence with **word**",
      "sentence_zh": "Traditional Chinese translation",
      "tip": "Usage tip in formal or journalistic context"

    {
      "category": "學術/技術 (Academic / Technical)",
      "sentence_en": "Academic English sentence with **word**",
      "sentence_zh": "Traditional Chinese translation",
      "tip": "Academic usage tip and connotations"
    }
  ]
}`;
          userPrompt = `請深度剖析以下單字並提供 4 種情境實用例句，輸出標準 JSON：
"${queryText}"`;
        }

        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    { text: `${systemPrompt}\n\n${userPrompt}` }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.3,
                responseMimeType: "application/json"
              }
            })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            const errMsg = errData.error?.message || `HTTP ${response.status}: ${response.statusText}`;
            throw new Error(errMsg);
          }

          const resData = await response.json();
          const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) {
            throw new Error('Gemini API 未回傳有效內容，請稍後重試。');
          }

          // Safe JSON parsing (handles potential code fences)
          let parsed;
          try {
            parsed = JSON.parse(rawText);
          } catch {
            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              parsed = JSON.parse(jsonMatch[0]);
            } else {
              throw new Error('無法解析 AI 回傳之 JSON 結構。');

          setResultData(parsed);

            id: Date.now().toString(),
            timestamp: new Date().toISOString(),
            tab: activeTab,
            input: queryText,
            result: parsed,
            starred: false

        a.click();
        URL.revokeObjectURL(url);

    // --- Blind Listening & Dictation Interactive Box ---
    function BlindSentenceBox({ sentence, blindMode, onPlay, highlightWord }) {
      const [revealed, setRevealed] = useState(false);
      const [dictationInput, setDictationInput] = useState('');
      const [checkResult, setCheckResult] = useState(null);

      // Reset state if blind mode toggled off
      useEffect(() => {
        if (!blindMode) {
          setRevealed(false);
          setCheckResult(null);
        }
      }, [blindMode]);

      // Highlight target word in text
      const renderSentenceText = () => {
        if (!highlightWord) {
          // Clean double asterisks if Gemini wrapped it
          const parts = sentence.split(/(\*\*.*?\*\*)/g);
          return parts.map((part, i) => {
            if (part.startsWith('**') && part.endsWith('**')) {
              return <strong key={i} className="text-brand-600 dark:text-brand-400 font-bold">{part.slice(2, -2)}</strong>;
            }
            return part;
          });
        }

        // Highlight matching word case-insensitively
        const regex = new RegExp(`(${highlightWord})`, 'gi');
        const parts = sentence.split(regex);
        return parts.map((part, i) => (
          regex.test(part) ? (
            <strong key={i} className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950/60 px-1 rounded">
              {part}
            </strong>
          ) : part
        ));
      };

      // Evaluate Dictation Match
      const handleCheckDictation = () => {
        if (!dictationInput.trim()) return;

        const normalize = (str) =>
          str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);

        const targetWords = normalize(sentence);
        const userWords = normalize(dictationInput);

        if (targetWords.length === 0) return;

        let matches = 0;
        const diff = [];
        let uIdx = 0;

        for (let i = 0; i < targetWords.length; i++) {
          const tWord = targetWords[i];
          const uWord = userWords[uIdx];

          if (uWord === tWord) {
            matches++;
            diff.push({ word: tWord, status: 'correct' });
            uIdx++;
          } else if (uIdx < userWords.length && userWords.slice(uIdx).includes(tWord)) {
            while (uIdx < userWords.length && userWords[uIdx] !== tWord) {
              diff.push({ word: userWords[uIdx], status: 'extra' });
              uIdx++;
            }
            if (uIdx < userWords.length && userWords[uIdx] === tWord) {
              matches++;
              diff.push({ word: tWord, status: 'correct' });
              uIdx++;
            }
          } else {
            diff.push({ word: tWord, status: 'missing' });
          }
        }

        while (uIdx < userWords.length) {
          diff.push({ word: userWords[uIdx], status: 'extra' });
          uIdx++;
        }

        const accuracy = Math.round((matches / Math.max(targetWords.length, userWords.length)) * 100);
        setCheckResult({ accuracy, diff });
      };

      if (!blindMode) {
        return (
          <p className="text-sm sm:text-base font-normal text-slate-900 dark:text-white leading-relaxed">
            {renderSentenceText()}
          </p>
        );
      }

      return (
        <div className="space-y-3">
          {/* Obscured Sentence */}
          <div className="relative p-3 rounded-xl bg-slate-100/70 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 overflow-hidden">
            <p className={`text-sm sm:text-base font-normal text-slate-900 dark:text-white leading-relaxed ${revealed ? '' : 'blind-blur'}`}>
              {renderSentenceText()}
            </p>

            {!revealed && (
              <div className="absolute inset-0 flex items-center justify-center gap-2 bg-slate-900/10 dark:bg-slate-950/20 backdrop-blur-[2px]">
                <button
                  type="button"
                  onClick={onPlay}
                  className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs shadow-md flex items-center gap-1.5 transition active:scale-95"
                >
                  <Icon name="volume" className="w-3.5 h-3.5" />
                  <span>聽音訊</span>
                </button>
                <button
                  type="button"
                  onClick={() => setRevealed(true)}
                  className="px-3 py-1.5 rounded-lg bg-white/90 dark:bg-slate-800/90 hover:bg-white text-slate-700 dark:text-slate-200 text-xs font-semibold shadow-xs flex items-center gap-1.5 transition"
                >
                  <Icon name="eye" className="w-3.5 h-3.5" />
                  <span>看答案</span>
                </button>
              </div>
            )}
          </div>

          {/* Dictation Input Box */}
          <div className="space-y-2">
            <div className="flex items-center gap-2">
              <input
                type="text"
                value={dictationInput}
                onChange={(e) => setDictationInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') handleCheckDictation();
                }}
                placeholder="在此輸入你聽到的英文句子進行聽寫..."
                className="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
              <button
                type="button"
                onClick={handleCheckDictation}
                className="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs whitespace-nowrap transition"
              >
                比對
              </button>
              {revealed && (
                <button
                  type="button"
                  onClick={() => setRevealed(false)}
                  className="p-1.5 text-slate-400 hover:text-slate-600"
                  title="重新隱藏"
                >
                  <Icon name="eye-off" className="w-4 h-4" />
                </button>
              )}
            </div>

            {/* Check Result Feedback */}
            {checkResult && (
              <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2 text-xs">
                <div className="flex items-center justify-between">
                  <span className="font-semibold text-slate-700 dark:text-slate-300">
                    聽寫準確率評估：
                  </span>
                  <span className={`font-mono font-bold px-2 py-0.5 rounded ${
                    checkResult.accuracy >= 90
                      ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'
                      : checkResult.accuracy >= 70
                      ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                      : 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300'
                  }`}>
                    {checkResult.accuracy}% {checkResult.accuracy === 100 ? '🎉 完美！' : checkResult.accuracy >= 80 ? '💪 很棒！' : '加油！'}
                  </span>
                </div>

                {/* Diff Words breakdown */}
                <div className="flex flex-wrap gap-1 items-center pt-1">
                  {checkResult.diff.map((item, idx) => (
                    <span
                      key={idx}
                      className={`px-1.5 py-0.5 rounded text-[11px] font-mono ${
                        item.status === 'correct'
                          ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
                          : item.status === 'missing'
                          ? 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 line-through'
                          : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
                      }`}
                      title={item.status === 'correct' ? '完全符合' : item.status === 'missing' ? '漏聽或拼錯' : '多打的字詞'}
                    >
                      {item.word}
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

              {items.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-xs">
                  <p>尚無任何{sidebarTab === 'favorites' ? '收藏項目' : '歷史紀錄'}</p>
                  <p className="mt-1 text-[11px]">可隨時點擊結果卡片右上角的 ⭐ 進行收藏！</p>
                </div>
              ) : (
                items.map((item, idx) => {
                  const isStarred = favorites.some(f => f.input === item.input && f.tab === item.tab);
                  return (
                    <div
                      key={idx}
                      className="group p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 hover:border-brand-400 dark:hover:border-brand-600 transition shadow-xs flex flex-col justify-between gap-2"
                    >
                      <div className="flex items-start justify-between gap-2">
                        <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500">
                          {item.tab === 'tab1' ? '🇨🇳 中翻英' : item.tab === 'tab2' ? '✍️ 英潤飾' : '📚 單字'}
                        </span>
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            onToggleStar(item);
                          }}
                          className="text-slate-400 hover:text-amber-500 p-1"
                        >
                          <Icon name={isStarred ? 'star' : 'star-outline'} className={`w-4 h-4 ${isStarred ? 'text-amber-500' : ''}`} />
                        </button>
                      </div>

                      <div
                        onClick={() => onSelectItem(item)}
                        className="cursor-pointer"
                      >
                        <p className="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-100 line-clamp-2">
                          {item.input}
                        </p>
                        <p className="text-[11px] text-slate-400 mt-1 line-clamp-1">
                          {item.tab === 'tab1' && item.result?.direct_translation}
                          {item.tab === 'tab2' && item.result?.grammar_polish?.corrected}
                          {item.tab === 'tab3' && item.result?.deconstruction?.definition_zh}
                        </p>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            {/* Bottom Actions Bar */}
            <div className="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex items-center justify-between gap-2 text-xs">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={onExportMarkdown}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 flex items-center gap-1 font-medium transition"
                  title="匯出為 Markdown 筆記"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>MD 筆記</span>
                </button>

                <button
                  onClick={onExportJson}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 flex items-center gap-1 font-medium transition"
                  title="匯出 JSON 備份"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>JSON 備份</span>
                </button>
              </div>

              {sidebarTab === 'history' && items.length > 0 && (
                <button
                  onClick={onClearHistory}
                  className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-950 rounded-lg transition"
                  title="清空歷史紀錄"
                >
                  <Icon name="trash" className="w-4 h-4" />
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Render the App into the root container
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
