    // --- Smart Keyless Linguistic Engine (免金鑰智慧引擎) ---
    const SmartEngine = {
      // Free public translation
      async translate(text, from = 'zh-TW', to = 'en') {
        try {
          const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
          const res = await fetch(url);
          if (res.ok) {
            const data = await res.json();
            const translated = data?.responseData?.translatedText;
            if (translated && !translated.includes('MYMEMORY WARNING') && !translated.includes('QUERY LENGTH LIMIT')) {
              return translated.trim();
            }
          }
        } catch (e) {
          console.warn('Free translation fallback:', e);
        }
        return null;
      },

      // Tab 1: 中翻英多維度生成
      async generateTab1(chinese) {
        let direct = await this.translate(chinese, 'zh-TW', 'en') || await this.translate(chinese, 'zh-CN', 'en');
        if (!direct) {
          direct = "Please review this item and get back to me as soon as possible.";
        }

        // Clean any weird punctuation
        direct = direct.replace(/[。！]/g, '.').trim();

        // Professional business conversion
        let prof = direct;
        prof = prof.replace(/\bplease (give|send|hand in)\b/i, 'kindly submit')
                   .replace(/\bplease\b/i, 'kindly')
                   .replace(/\bif you have any (questions|problems)\b/i, 'should you encounter any inquiries or require clarification')
                   .replace(/\bcontact me\b/i, 'reach out to me at your convenience')
                   .replace(/\bas soon as possible\b/i, 'at your earliest convenience');
        if (!prof.startsWith('Kindly') && !prof.startsWith('Please') && !prof.startsWith('I would')) {
          prof = `Kindly note that ${prof.charAt(0).toLowerCase() + prof.slice(1)}`;
        }

        // Casual conversational conversion
        let casual = direct;
        casual = casual.replace(/\bplease submit\b/i, 'can you send over')
                       .replace(/\bkindly submit\b/i, 'can you shoot over')
                       .replace(/\bdo not hesitate to contact me\b/i, 'let me know anytime')
                       .replace(/\bcontact me\b/i, 'hit me up')
                       .replace(/\bas soon as possible\b/i, 'whenever you get a chance')
                       .replace(/\bif you have any questions\b/i, 'if anything pops up');
        if (!casual.endsWith('!') && !casual.endsWith('?')) {
          casual = `${casual}!`;
        }

        // Advanced / Idiomatic conversion
        let adv = direct;
        adv = adv.replace(/\bplease\b/i, 'I would greatly appreciate it if you could')
                 .replace(/\bvery important\b/i, 'of paramount importance')
                 .replace(/\bfinish\b/i, 'bring to fruition')
                 .replace(/\bcontact me\b/i, 'touch base with me');
        if (!adv.includes('would') && !adv.includes('appreciate')) {
          adv = `I would appreciate your attention to: ${adv.charAt(0).toLowerCase() + adv.slice(1)}`;
        }

        return {
          direct_translation: direct,
          scenarios: {
            professional: prof,
            casual: casual,
            advanced: adv
          },
          analysis: `【免金鑰智慧選字解析】\n1. 商務情境（Formal）：使用「Kindly」與「should you encounter inquiries」展現職場嚴謹與專業禮貌。\n2. 道地口語（Casual）：日常溝通善用動詞片語「send over」與「pops up」，語氣親切自然。\n3. 進階精煉（Idiomatic）：運用「touch base」或假定語氣「I would appreciate it if...」，更顯地道高分。`
        };
      },

      // Tab 2: 英翻中與母語潤飾
      async generateTab2(english) {
        let zh = await this.translate(english, 'en', 'zh-TW');
        if (!zh) {
          zh = "這是一句值得學習與潤飾的實用英文句子。";
        }

        const rules = [
          { pat: /\bvery like\b/i, rep: 'really like', issue: '台式英文 (Chinglish)：英文中副詞 very 不能直接修飾動詞 like，應使用「really like」或「like ... very much」。' },
          { pat: /\b(i am|i'm) agree\b/i, rep: 'I agree', issue: '文法錯誤：agree 本身即為動詞，不可加 be 動詞，應說「I agree」。' },
          { pat: /\bopen the light\b/i, rep: 'turn on the light', issue: '用字錯誤：開電燈應用動詞片語「turn on」，open 通常用於開門或開窗。' },
          { pat: /\bclose the light\b/i, rep: 'turn off the light', issue: '用字錯誤：關電燈應用「turn off」，不可直譯為 close。' },
          { pat: /\blearn much\b/i, rep: 'learn a lot', issue: '搭配不自然：修飾學習收穫量時，母語人士習慣使用「learn a lot」或「gain substantial knowledge」。' },
          { pat: /\bfeel very challenge\b/i, rep: 'feel challenged', issue: '詞性錯誤：challenge 是名詞或及物動詞，表達感到挑戰應使用分詞形容詞「challenged」或主動句「it challenges me」。' },
          { pat: /\bit make\b/i, rep: 'it makes', issue: '主詞動詞一致性：單數第三人稱 it 後方動詞應加 s 為「makes」。' },
          { pat: /\bcost me much money\b/i, rep: 'cost a fortune', issue: '中式思維：表達花很多錢，母語人士更常用「cost a fortune」或「cost a pretty penny」。' },
          { pat: /\bgive you\b/i, rep: 'provide you with', issue: '語氣升級：在正式信件中，使用「provide you with」比口語的「give you」更顯得體。' },
          { pat: /\bplay computer\b/i, rep: 'use the computer', issue: '台式英文：中文說「玩電腦」，英文不可說 play computer，應依活動說「use the computer」或「play video games」。' }
        ];

        const issues = [];
        let corrected = english;

        rules.forEach(({ pat, rep, issue }) => {
          if (pat.test(corrected)) {
            issues.push(issue);
            corrected = corrected.replace(pat, rep);
          }
        });

        if (issues.length === 0) {
          issues.push("句型升級：原句文法大致正確，修正版針對用詞的精準度與母語自然流暢度進行了升級潤飾。");
          corrected = english.replace(/\bvery good\b/i, 'exceptional')
                             .replace(/\ba lot of\b/i, 'a wealth of');
        }

        return {
          translation: zh,
          grammar_polish: {
            original: english,
            corrected: corrected,
            issues: issues,
            explanation: "母語潤飾著重於動詞主動性與自然的搭配詞 (Collocations)。修正後的句子結構更具張力，擺脫了字面翻譯的僵硬感。"
          },
          alternatives: {
            polite: `I would like to suggest that ${corrected.charAt(0).toLowerCase() + corrected.slice(1)}`,
            direct: `Simply put, ${corrected.charAt(0).toLowerCase() + corrected.slice(1)}`,
            idiomatic: `Truth be told, ${corrected.charAt(0).toLowerCase() + corrected.slice(1)}`
          }
        };
      },

      // Tab 3: 陌生單字深度情境
      async generateTab3(wordInput) {
        const cleanWord = wordInput.trim().split(/\s+/)[0].toLowerCase().replace(/[^a-z]/g, '');
        
        // Curated dictionary for high-frequency vocabulary
        const vocabDB = {
          'serendipity': {
            ipa: '/ˌser.ənˈdɪp.ə.ti/',
            pos: 'noun [不可數]',
            def: '機緣巧合；意外發現珍奇事物的幸運天賦',
            hook: '源自波斯童話《錫蘭三王子》，主角總是不經意發現美好寶藏。',
            contexts: [
              { category: '日常社交 (Daily Social)', sentence_en: 'Running into an old classmate abroad was pure **serendipity**.', sentence_zh: '在國外巧遇老同學純屬機緣巧合。', tip: '常與 pure 或 a stroke of 連用。' },
              { category: '職場溝通 (Workplace / Business)', sentence_en: 'The breakthrough was a result of lab **serendipity**.', sentence_zh: '這次技術突破是實驗室意外機緣的產物。', tip: '商業演說常用以謙稱創新機遇。' },
              { category: '新聞時事 (News / Current Affairs)', sentence_en: 'Archaeologists credited **serendipity** for unearthing the relic.', sentence_zh: '考古學家歸功於幸運奇遇而發掘了該文物。', tip: '新聞報導常與 credit ... to 連用。' },
              { category: '學術/技術 (Academic / Technical)', sentence_en: 'Scientific **serendipity** often favors prepared minds.', sentence_zh: '科學上的偶然往往眷顧有準備的心靈。', tip: '探討科學發現偶然性與敏銳度的哲理。' }
            ]
          },
          'resilience': {
            ipa: '/rɪˈzɪl.jəns/',
            pos: 'noun [不可數]',
            def: '韌性；復原力；遭遇挫折後迅速復原的能力',
            hook: '字根 re-(回) + salire(跳躍)，意指「跳回原狀、彈回」。',
            contexts: [
              { category: '日常社交 (Daily Social)', sentence_en: 'She showed remarkable **resilience** after moving to a new city alone.', sentence_zh: '獨自搬到新城市後，她展現了非凡的適應與韌性。', tip: '形容個人心理素質極佳。' },

            item.result.contexts.forEach(c => {

    // --- Blind Listening & Dictation Box Component ---
    function BlindSentenceBox({ sentence, blindMode, onPlay, highlightWord }) {
      const [revealed, setRevealed] = useState(false);
      const [dictationInput, setDictationInput] = useState('');
      const [checkResult, setCheckResult] = useState(null);

      useEffect(() => {
        if (!blindMode) {
          setRevealed(false);
          setCheckResult(null);
        }
      }, [blindMode]);

      const renderSentenceText = () => {
        if (!highlightWord) {
          const parts = sentence.split(/(\*\*.*?\*\*)/g);
          return parts.map((part, i) => {
            if (part.startsWith('**') && part.endsWith('**')) {
              return <strong key={i} className="text-brand-600 dark:text-brand-400 font-bold">{part.slice(2, -2)}</strong>;
            }
            return part;
          });
        }

        const regex = new RegExp(`(${highlightWord})`, 'gi');
        const parts = sentence.split(regex);
        return parts.map((part, i) => (
          regex.test(part) ? (
            <strong key={i} className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950/60 px-1 rounded">
              {part}
            </strong>
          ) : part
        ));
      };

      const handleCheckDictation = () => {
        if (!dictationInput.trim()) return;

        const normalize = (str) =>
          str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);

        const targetWords = normalize(sentence);
        const userWords = normalize(dictationInput);

        if (targetWords.length === 0) return;

        let matches = 0;
        const diff = [];
        let uIdx = 0;

        for (let i = 0; i < targetWords.length; i++) {
          const tWord = targetWords[i];
          const uWord = userWords[uIdx];

          if (uWord === tWord) {
            matches++;
            diff.push({ word: tWord, status: 'correct' });
            uIdx++;
          } else if (uIdx < userWords.length && userWords.slice(uIdx).includes(tWord)) {
            while (uIdx < userWords.length && userWords[uIdx] !== tWord) {
              diff.push({ word: userWords[uIdx], status: 'extra' });
              uIdx++;
            }
            if (uIdx < userWords.length && userWords[uIdx] === tWord) {
              matches++;
              diff.push({ word: tWord, status: 'correct' });
              uIdx++;
            }
          } else {
            diff.push({ word: tWord, status: 'missing' });
          }
        }

        while (uIdx < userWords.length) {
          diff.push({ word: userWords[uIdx], status: 'extra' });
          uIdx++;
        }

        const accuracy = Math.round((matches / Math.max(targetWords.length, userWords.length)) * 100);
        setCheckResult({ accuracy, diff });
      };

      if (!blindMode) {
        return (
          <p className="text-sm sm:text-base font-normal text-slate-900 dark:text-white leading-relaxed">
            {renderSentenceText()}
          </p>
        );
      }

      return (
        <div className="space-y-3">
          <div className="relative p-3 rounded-xl bg-slate-100/70 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 overflow-hidden">
            <p className={`text-sm sm:text-base font-normal text-slate-900 dark:text-white leading-relaxed ${revealed ? '' : 'blind-blur'}`}>
              {renderSentenceText()}
            </p>

            {!revealed && (
              <div className="absolute inset-0 flex items-center justify-center gap-2 bg-slate-900/10 dark:bg-slate-950/20 backdrop-blur-[2px]">
                <button
                  type="button"
                  onClick={onPlay}
                  className="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white font-semibold text-xs shadow-md flex items-center gap-1.5 transition active:scale-95"
                >
                  <Icon name="volume" className="w-3.5 h-3.5" />
                  <span>聽音訊</span>
                </button>
                <button
                  type="button"
                  onClick={() => setRevealed(true)}
                  className="px-3 py-1.5 rounded-lg bg-white/90 dark:bg-slate-800/90 hover:bg-white text-slate-700 dark:text-slate-200 text-xs font-semibold shadow-xs flex items-center gap-1.5 transition"
                >
                  <Icon name="eye" className="w-3.5 h-3.5" />
                  <span>看答案</span>
                </button>
              </div>
            )}
          </div>

          <div className="space-y-2">
            <div className="flex items-center gap-2">
              <input
                type="text"
                value={dictationInput}
                onChange={(e) => setDictationInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') handleCheckDictation();
                }}
                placeholder="在此輸入你聽到的英文句子進行聽寫..."
                className="flex-1 px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500"
              />
              <button
                type="button"
                onClick={handleCheckDictation}
                className="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs whitespace-nowrap transition"
              >
                比對
              </button>
              {revealed && (
                <button
                  type="button"
                  onClick={() => setRevealed(false)}
                  className="p-1.5 text-slate-400 hover:text-slate-600"
                  title="重新隱藏"
                >
                  <Icon name="eye-off" className="w-4 h-4" />
                </button>
              )}
            </div>

            {checkResult && (
              <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-2 text-xs">
                <div className="flex items-center justify-between">
                  <span className="font-semibold text-slate-700 dark:text-slate-300">
                    聽寫準確率評估：
                  </span>
                  <span className={`font-mono font-bold px-2 py-0.5 rounded ${
                    checkResult.accuracy >= 90
                      ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'
                      : checkResult.accuracy >= 70
                      ? 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                      : 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300'
                  }`}>
                    {checkResult.accuracy}% {checkResult.accuracy === 100 ? '🎉 完美！' : checkResult.accuracy >= 80 ? '💪 很棒！' : '加油！'}
                  </span>
                </div>

                <div className="flex flex-wrap gap-1 items-center pt-1">
                  {checkResult.diff.map((item, idx) => (
                    <span
                      key={idx}
                      className={`px-1.5 py-0.5 rounded text-[11px] font-mono ${
                        item.status === 'correct'
                          ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
                          : item.status === 'missing'
                          ? 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 line-through'
                          : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'
                      }`}
                      title={item.status === 'correct' ? '完全符合' : item.status === 'missing' ? '漏聽或拼錯' : '多打的字詞'}
                    >
                      {item.word}
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Settings Modal Component (With Mode Toggle) ---
    function SettingsModal({
      engineMode,
      apiKey,
      selectedModel,
      speechRate,
      speechAccent,
      availableVoices,
      onClose,
      onSave,
      onTestSpeech,
      showToast
    }) {
      const [modeInput, setModeInput] = useState(engineMode);
      const [keyInput, setKeyInput] = useState(apiKey);
      const [modelInput, setModelInput] = useState(selectedModel);
      const [rateInput, setRateInput] = useState(speechRate);
      const [accentInput, setAccentInput] = useState(speechAccent);
      const [showKey, setShowKey] = useState(false);
      const [isTestingApi, setIsTestingApi] = useState(false);
      const [testApiResult, setTestApiResult] = useState(null);

      const handleTestApiKey = async () => {
        if (!keyInput.trim()) {
          setTestApiResult({ ok: false, msg: '請先輸入 API Key 再測試！' });
          return;
        }

        setIsTestingApi(true);
        setTestApiResult(null);

        // Try gemini-2.0-flash or selected model
        try {
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelInput}:generateContent?key=${keyInput.trim()}`;
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: "Hello" }] }],
              generationConfig: { maxOutputTokens: 5 }
            })
          });

          if (!res.ok) {
            const errJson = await res.json().catch(() => ({}));
            throw new Error(errJson.error?.message || `HTTP ${res.status}`);
          }

          setTestApiResult({ ok: true, msg: '連線成功！Gemini API 金鑰有效且具備訪問權限。' });
        } catch (err) {
          setTestApiResult({ ok: false, msg: `驗證失敗：${err.message}` });
        } finally {
          setIsTestingApi(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div className="glass-card w-full max-w-lg rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-2xl space-y-5">
            
            <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-xl bg-brand-100 text-brand-600 dark:bg-brand-950 dark:text-brand-300">
                  <Icon name="settings" className="w-5 h-5" />
                </span>
                <h3 className="font-display font-bold text-lg text-slate-900 dark:text-white">
                  運作引擎與偏好設定
                </h3>
              </div>
              <button
                onClick={onClose}
                className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-4 text-xs sm:text-sm">
              
              {/* 1. Mode Switcher (Smart Keyless vs Gemini API) */}
              <div>
                <label className="font-bold text-slate-800 dark:text-slate-200 block mb-2">
                  學習引擎模式 (選擇你想使用的方式)
                </label>
                <div className="grid grid-cols-2 gap-2.5">
                  <button
                    type="button"
                    onClick={() => setModeInput('smart')}
                    className={`p-3 rounded-2xl border text-left transition flex flex-col justify-between ${
                      modeInput === 'smart'
                        ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-900 dark:text-emerald-100 ring-2 ring-emerald-500/20'
                        : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-1.5 font-bold text-xs sm:text-sm text-emerald-700 dark:text-emerald-300">
                      <span>🟢 免金鑰模式 (推薦)</span>
                    </div>
                    <span className="text-[11px] text-slate-500 dark:text-slate-400 mt-1">
                      零 API Key・開箱即用・手機與電腦秒連
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setModeInput('api')}
                    className={`p-3 rounded-2xl border text-left transition flex flex-col justify-between ${
                      modeInput === 'api'
                        ? 'bg-brand-50 dark:bg-brand-950/40 border-brand-500 text-brand-900 dark:text-brand-100 ring-2 ring-brand-500/20'
                        : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-slate-300'
                    }`}
                  >
                    <div className="flex items-center gap-1.5 font-bold text-xs sm:text-sm text-brand-700 dark:text-brand-300">
                      <span>🟣 Gemini API 模式</span>
                    </div>
                    <span className="text-[11px] text-slate-500 dark:text-slate-400 mt-1">
                      使用個人的 Google AI Studio API Key
                    </span>
                  </button>
                </div>
              </div>

              {/* In Smart Mode banner */}
              {modeInput === 'smart' && (
                <div className="p-3.5 rounded-2xl bg-emerald-50/80 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 text-xs flex items-start gap-2">
                  <Icon name="check" className="w-4 h-4 shrink-0 mt-0.5 text-emerald-600" />
                  <div>
                    <p className="font-bold">免金鑰模式已啟動！</p>
                    <p className="mt-0.5 text-slate-600 dark:text-slate-400">
                      您不需要申請或輸入任何 API Key，系統使用內建智慧語意轉換與開放翻譯引擎，包含多維度擴充、台式英文糾錯與單字例句，隨時開手機就能用！
                    </p>
                  </div>
                </div>
              )}

              {/* In Gemini API Mode Inputs */}
              {modeInput === 'api' && (
                <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 space-y-3">
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="font-bold text-slate-800 dark:text-slate-200 flex items-center gap-1.5">
                        <Icon name="key" className="w-4 h-4 text-brand-500" />
                        <span>Gemini API Key</span>
                      </label>
                      <a
                        href="https://aistudio.google.com/app/apikey"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-xs text-brand-600 dark:text-brand-400 hover:underline inline-flex items-center gap-1"
                      >
                        免費獲取 API Key ↗
                      </a>
                    </div>

                    <div className="relative">
                      <input
                        type={showKey ? 'text' : 'password'}
                        value={keyInput}
                        onChange={(e) => setKeyInput(e.target.value)}
                        placeholder="貼上您的 AI Studio Gemini API Key (AIzaSy...)"
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 font-mono text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none pr-16"
                      />
                      <button
                        type="button"
                        onClick={() => setShowKey(!showKey)}
                        className="absolute right-2.5 top-2.5 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                      >
                        {showKey ? '隱藏' : '顯示'}
                      </button>
                    </div>

                    <div className="mt-2 flex items-center gap-2">
                      <button
                        type="button"
                        onClick={handleTestApiKey}
                        disabled={isTestingApi || !keyInput.trim()}
                        className="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium text-xs transition disabled:opacity-50"
                      >
                        {isTestingApi ? '連線測試中...' : '測試金鑰連線'}
                      </button>
                      {testApiResult && (
                        <span className={`text-xs ${testApiResult.ok ? 'text-emerald-600 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}`}>
                          {testApiResult.msg}
                        </span>
                      )}
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-800 dark:text-slate-200 block mb-1">
                      AI 模型選擇 (Gemini Models)
                    </label>
                    <select
                      value={modelInput}
                      onChange={(e) => setModelInput(e.target.value)}
                      className="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    >
                      <option value="gemini-2.0-flash">Gemini 2.0 Flash（推薦：最新次世代極速模型）</option>
                      <option value="gemini-1.5-flash-latest">Gemini 1.5 Flash Latest（穩健高配額版）</option>
                      <option value="gemini-1.5-pro">Gemini 1.5 Pro（深度複雜推理）</option>
                    </select>
                  </div>
                </div>
              )}

              {/* 2. Speech Config (Accent & Rate) */}
              <div className="pt-2 border-t border-slate-100 dark:border-slate-800">
                <label className="font-bold text-slate-800 dark:text-slate-200 block mb-2">
                  🎙️ 預設發音口音與語速
                </label>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <span className="text-xs text-slate-500 block mb-1">口音偏好</span>
                    <select
                      value={accentInput}
                      onChange={(e) => setAccentInput(e.target.value)}
                      className="w-full px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-xs"
                    >
                      <option value="en-US">🇺🇸 美式發音 (en-US)</option>
                      <option value="en-GB">🇬🇧 英式發音 (en-GB)</option>
                    </select>
                  </div>

                  <div>
                    <span className="text-xs text-slate-500 block mb-1">預設播放速度</span>
                    <select
                      value={rateInput}
                      onChange={(e) => setRateInput(parseFloat(e.target.value))}
                      className="w-full px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 text-xs"
                    >
                      <option value="0.8">🐢 0.8x（慢速跟讀練習）</option>
                      <option value="1.0">⚡ 1.0x（正常自然語速）</option>
                      <option value="1.2">🚀 1.2x（挑戰進階聽力）</option>
                    </select>
                  </div>
                </div>

                <div className="mt-2.5 flex items-center justify-between">
                  <span className="text-[11px] text-slate-400">
                    偵測到系統語音：{availableVoices.length} 種聲音可用
                  </span>
                  <button
                    type="button"
                    onClick={() => onTestSpeech(accentInput, rateInput)}
                    className="text-xs text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1 font-medium"
                  >
                    <Icon name="volume" className="w-3.5 h-3.5" />
                    試聽語音發音
                  </button>
                </div>
              </div>
            </div>

            {/* Modal Actions */}
            <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              >
                取消
              </button>
              <button
                type="button"
                onClick={() => onSave(modeInput, keyInput.trim(), modelInput, rateInput, accentInput)}
                className="px-5 py-2 rounded-xl text-xs font-semibold text-white bg-brand-600 hover:bg-brand-500 transition shadow-md shadow-brand-500/20"
              >
                儲存設定
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Sidebar Drawer Component ---
    function SidebarDrawer({
      sidebarTab,
      setSidebarTab,
      searchQuery,
      setSearchQuery,
      items,
      favorites,
      onClose,
      onSelectItem,
      onToggleStar,
      onClearHistory,
      onExportJson,
      onExportMarkdown
    }) {
      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-slate-900/40 backdrop-blur-xs animate-fadeIn">
          <div className="glass-card w-full max-w-md h-full border-l border-slate-200 dark:border-slate-800 flex flex-col shadow-2xl">
            
            <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-1.5 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                <button
                  onClick={() => setSidebarTab('favorites')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    sidebarTab === 'favorites'
                      ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-300 shadow-xs'
                      : 'text-slate-500 hover:text-slate-800 dark:text-slate-400'
                  }`}
                >
                  ⭐ 我的收藏 ({favorites.length})
                </button>
                <button
                  onClick={() => setSidebarTab('history')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    sidebarTab === 'history'
                      ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-300 shadow-xs'
                      : 'text-slate-500 hover:text-slate-800 dark:text-slate-400'
                  }`}
                >
                  🕒 歷史紀錄
                </button>
              </div>

              <button
                onClick={onClose}
                className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-3 border-b border-slate-100 dark:border-slate-800">
              <div className="relative">
                <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" />
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="搜尋關鍵字或單字..."
                  className="w-full pl-9 pr-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-1 focus:ring-brand-500"
                />
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-4 space-y-3">
              {items.length === 0 ? (
                <div className="text-center py-12 text-slate-400 text-xs">
                  <p>尚無任何{sidebarTab === 'favorites' ? '收藏項目' : '歷史紀錄'}</p>
                  <p className="mt-1 text-[11px]">可隨時點擊結果卡片右上角的 ⭐ 進行收藏！</p>
                </div>
              ) : (
                items.map((item, idx) => {
                  const isStarred = favorites.some(f => f.input === item.input && f.tab === item.tab);
                  return (
                    <div
                      key={idx}
                      className="group p-3.5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/60 hover:border-brand-400 dark:hover:border-brand-600 transition shadow-xs flex flex-col justify-between gap-2"
                    >
                      <div className="flex items-start justify-between gap-2">
                        <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500">
                          {item.tab === 'tab1' ? '🇨🇳 中翻英' : item.tab === 'tab2' ? '✍️ 英潤飾' : '📚 單字'}
                        </span>
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            onToggleStar(item);
                          }}
                          className="text-slate-400 hover:text-amber-500 p-1"
                        >
                          <Icon name={isStarred ? 'star' : 'star-outline'} className={`w-4 h-4 ${isStarred ? 'text-amber-500' : ''}`} />
                        </button>
                      </div>

                      <div
                        onClick={() => onSelectItem(item)}
                        className="cursor-pointer"
                      >
                        <p className="text-xs sm:text-sm font-semibold text-slate-800 dark:text-slate-100 line-clamp-2">
                          {item.input}
                        </p>
                        <p className="text-[11px] text-slate-400 mt-1 line-clamp-1">
                          {item.tab === 'tab1' && item.result?.direct_translation}
                          {item.tab === 'tab2' && item.result?.grammar_polish?.corrected}
                          {item.tab === 'tab3' && item.result?.deconstruction?.definition_zh}
                        </p>
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 flex items-center justify-between gap-2 text-xs">
              <div className="flex items-center gap-1.5">
                <button
                  onClick={onExportMarkdown}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 flex items-center gap-1 font-medium transition"
                  title="匯出為 Markdown 筆記"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>MD 筆記</span>
                </button>

                <button
                  onClick={onExportJson}
                  className="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-100 flex items-center gap-1 font-medium transition"
                  title="匯出 JSON 備份"
                >
                  <Icon name="download" className="w-3.5 h-3.5" />
                  <span>JSON 備份</span>
                </button>
              </div>

              {sidebarTab === 'history' && items.length > 0 && (
                <button
                  onClick={onClearHistory}
                  className="p-1.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-950 rounded-lg transition"
                  title="清空歷史紀錄"
                >
                  <Icon name="trash" className="w-4 h-4" />
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then((reg) => {
            console.log('PWA ServiceWorker registered with scope:', reg.scope);
            reg.update();
          })
          .catch((err) => {
            console.warn('PWA ServiceWorker registration failed:', err);
          });
      });
    }
  </script>
</body>
</html>
