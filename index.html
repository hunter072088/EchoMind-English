  <script>
    window.emergencyRecovery = async function() {
      try {
        localStorage.removeItem('english_studio_tab_states');
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
      } catch (e) {
        console.error(e);
      }
      window.location.href = window.location.pathname + '?reset=' + Date.now();
    };

    setTimeout(function() {
      var fallback = document.getElementById('load-fallback');
      if (fallback) fallback.style.display = 'block';
    }, 4000);
  </script>

    // --- Smart Keyless Linguistic Engine (免金鑰智慧引擎 2.5) ---
    const SmartEngine = {
      // High reliability public translation (GTX + MyMemory dual-pipeline)
      async translate(text, from = 'zh-TW', to = 'en') {
        if (!text || !text.trim()) return '';
        // 1. Try Google Translate public web API (fast, high precision)
        try {
          const gtxUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
          const res = await fetch(gtxUrl);
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data?.[0])) {
              const fullText = data[0].map(item => item[0]).filter(Boolean).join('');
              if (fullText.trim()) return fullText.trim();
            }
          }
        } catch (e) {
          console.warn('GTX translation fallback:', e);
        }

        // 2. Try MyMemory API as fallback
        try {
          const mmUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
          const res = await fetch(mmUrl);
          if (res.ok) {
            const data = await res.json();
            const translated = data?.responseData?.translatedText;
            if (translated && !translated.includes('MYMEMORY WARNING') && !translated.includes('QUERY LENGTH LIMIT')) {
              return translated.trim();
            }
          }
        } catch (e) {
          console.warn('MyMemory fallback:', e);
        }
        return text;
      },

      // Tab 1: 中翻英多維度情境擴充 (包含改寫版本繁中翻譯)
      async generateTab1(chinese) {
        let direct = await this.translate(chinese, 'zh-TW', 'en') || await this.translate(chinese, 'zh-CN', 'en');
        if (!direct) {
          direct = "Please review this item and get back to me as soon as possible.";
        }
        direct = direct.replace(/[。！]/g, '.').trim();

        let prof = direct;
        let casual = direct;
        let adv = direct;

        let profTip = '適用於職場正式信件、專案交辦與跨國商務溝通，語氣嚴謹得體、重視專業分寸。';
        let casualTip = '適用於日常聚會、朋友閒聊、Slack/Teams 內部非正式討論，親切自然無距離感。';
        let advTip = '適用於高階簡報、托福雅思高分寫作、公開演講，句型層次豐富、展現高級英語修養。';

        // 1. 請求、交付、請託情境
        if (chinese.includes('請') || chinese.includes('麻煩') || chinese.includes('交給') || chinese.includes('確認') || chinese.includes('儘快') || chinese.includes('回報')) {
          prof = direct.replace(/^(please|kindly)\s+/i, '')
                       .replace(/^(can you|could you)\s+/i, '');
          prof = `Could you kindly ensure that ${prof.charAt(0).toLowerCase() + prof.slice(1)}? Your prompt feedback would be greatly appreciated.`;
          prof = prof.replace(/\bcontact me\b/gi, 'reach out to my attention')
                     .replace(/\bas soon as possible\b/gi, 'at your earliest convenience')
                     .replace(/\bquestions\b/gi, 'inquiries or clarifications');

          casual = direct.replace(/^(please|kindly)\s+/i, '');
          casual = `Can you take a quick look and shoot this over to me? Let me know if anything pops up!`;
          casualTip = '以動詞片語「take a quick look」與「shoot over」取代死板直譯，在口語中極其道地。';

          adv = `I would be exceedingly grateful if you could attend to this matter at your earliest convenience; please touch base should any bottleneck arise.`;
          advTip = '運用假定語氣「I would be grateful if...」與成語片語「touch base」，展現典雅洗鍊的高階風範。';
        }
        // 2. 意見、提案、想法情境
        else if (chinese.includes('認為') || chinese.includes('覺得') || chinese.includes('建議') || chinese.includes('方案') || chinese.includes('想法')) {
          prof = `From a strategic perspective, we believe this proposal presents a viable and robust course of action.`;
          profTip = '以「From a strategic perspective」開頭，賦予提案商業格局與說服力。';

          casual = `Honestly, I really feel like this idea is the way to go for us!`;
          casualTip = '使用「the way to go」，在母語者口語中是表達「這是最佳選擇」最生動自然的說法。';

          adv = `Compelling evidence substantiates this methodology as the most optimal solution to our current objectives.`;
          advTip = '以「Compelling evidence substantiates」強調論證的嚴密與不可動搖性。';
        }
        // 3. 狀態報告、已完成、確認情境
        else if (chinese.includes('已經') || chinese.includes('完成') || chinese.includes('做好') || chinese.includes('進度') || chinese.includes('成功')) {
          prof = `Please be advised that all associated deliverables have been successfully finalized in full alignment with our timeline.`;
          profTip = '商務公文標準開頭「Please be advised that」，適合對主管或客戶進行進度確認。';

          casual = `We're pretty much all set with this—everything wrapped up right on schedule!`;
          casualTip = '口語慣用語「all set」與「wrapped up」，傳遞事情圓滿解決的輕鬆俐落感。';

          adv = `All milestones have been brought to full fruition in strict accordance with our established benchmarks.`;

            else if (clean.endsWith('ly')) pos = 'adverb';

            const zhDef = await this.translate(clean, 'en', 'zh-TW') || '重要詞彙與概念';
            const enDef = `A notable ${pos} representing the essential concept or characteristic of ${clean} within practical language application.`;

            parsedWords.push({

    // --- Quota Tracking Helpers ---
    const QuotaTracker = {
      getTodayStr() {
        return new Date().toISOString().slice(0, 10);
      },
      getStats() {
        try {
          const today = this.getTodayStr();
          const raw = localStorage.getItem('gemini_api_quota_tracker');
          const data = raw ? JSON.parse(raw) : null;
          if (!data || data.date !== today) {
            return {
              date: today,
              requestsToday: 0,
              dailyLimit: 1500,
              tokensToday: 0,
              minuteRequests: 0,
              minuteLimit: 15,
              minuteStartTime: Date.now(),
              lastTokens: null
            };
          }
          if (Date.now() - data.minuteStartTime > 60000) {
            data.minuteRequests = 0;
            data.minuteStartTime = Date.now();
          }
          return data;
        } catch {
          return {
            date: this.getTodayStr(),
            requestsToday: 0,
            dailyLimit: 1500,
            tokensToday: 0,
            minuteRequests: 0,
            minuteLimit: 15,
            minuteStartTime: Date.now(),
            lastTokens: null
          };
        }
      },
      recordUsage(usageMetadata) {
        const stats = this.getStats();
        stats.requestsToday += 1;
        stats.minuteRequests += 1;
        if (usageMetadata) {
          const total = usageMetadata.totalTokenCount || 0;
          stats.tokensToday += total;
          stats.lastTokens = {
            prompt: usageMetadata.promptTokenCount || 0,
            candidates: usageMetadata.candidatesTokenCount || 0,
            total: total
          };
        }
        localStorage.setItem('gemini_api_quota_tracker', JSON.stringify(stats));
        return stats;
      }
    };

        window.speechSynthesis.cancel();

        const cleanText = text.replace(/[*_#`~[\\]]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.rate = rate;
        utterance.pitch = 1.0;

        const voices = availableVoices.length > 0 ? availableVoices : window.speechSynthesis.getVoices();
        const targetLang = accent === 'en-GB' ? 'en-GB' : 'en-US';

        const matchedVoice = voices.find(v => (v.lang.replace('_', '-') === targetLang) &&
          (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium') || v.name.includes('Samantha') || v.name.includes('Daniel') || v.name.includes('Jenny') || v.name.includes('Oliver')))
          || voices.find(v => v.lang.replace('_', '-') === targetLang)
          || voices.find(v => v.lang.replace('_', '-').startsWith(targetLang.split('-')[0]))
          || null;

        if (matchedVoice) {
          utterance.voice = matchedVoice;
        }
        utterance.lang = targetLang;

        utterance.onstart = () => setPlayingSentence(text);
        utterance.onend = () => setPlayingSentence(null);
        utterance.onerror = () => setPlayingSentence(null);

        window.speechSynthesis.speak(utterance);
      }, [speechRate, speechAccent, availableVoices, showToast]);

      const stopSpeech = useCallback(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setPlayingSentence(null);
        }
      }, []);

      // Normalized wordsList for Tab 3 (supports single word and multi-word list)
      const wordsList = useMemo(() => {
        if (!currentResult) return [];
        let list = [];
        if (Array.isArray(currentResult.words) && currentResult.words.length > 0) {
          list = currentResult.words;
        } else if (currentResult.deconstruction) {
          list = [{ deconstruction: currentResult.deconstruction, contexts: currentResult.contexts || [] }];
        } else if (Array.isArray(currentResult) && currentResult.length > 0) {
          list = currentResult;
        }
        return list.map(item => {
          if (!item) return { deconstruction: {}, contexts: [] };
          if (item.deconstruction) return { deconstruction: item.deconstruction, contexts: Array.isArray(item.contexts) ? item.contexts : [] };
          return { deconstruction: item, contexts: Array.isArray(item.contexts) ? item.contexts : [] };
        });
      }, [currentResult]);

      // Reset active word index when result changes
      useEffect(() => {
        setActiveWordIndex(0);
      }, [currentResult]);

      // Handle Word Click & Popover (Feature 2)
      const handleWordInteract = async (word, e, sourceSentence = '') => {
        e.stopPropagation();
        const clean = word.toLowerCase().replace(/[^a-z-]/g, '').trim();
        if (!clean) return;

        const rect = e.currentTarget.getBoundingClientRect();
        setWordPopover({
          word: clean,
          x: Math.min(Math.max(rect.left, 16), window.innerWidth - 260),
          y: rect.bottom + window.scrollY + 8,
          translation: '載入釋義中...',
          sourceSentence: sourceSentence,
          loading: true
        });

        // Fetch quick translation
        try {
          const trans = await SmartEngine.translate(clean, 'en', 'zh-TW');
          setWordPopover(prev => prev && prev.word === clean ? { ...prev, translation: trans || clean, loading: false } : prev);
        } catch {
          setWordPopover(prev => prev && prev.word === clean ? { ...prev, translation: clean, loading: false } : prev);
        }
      };

      // Close popover when clicking anywhere else
      useEffect(() => {
        const handleClickOutside = () => setWordPopover(null);
        window.addEventListener('click', handleClickOutside);
        return () => window.removeEventListener('click', handleClickOutside);
      }, []);

      // Save Word to Vocabulary Library
      const handleCollectWord = (word, translation = '', sourceSentence = '') => {
        const clean = word.toLowerCase().replace(/[^a-z-]/g, '').trim();
        if (!clean) return;

        const isAlreadySaved = savedVocab.some(v => v.word.toLowerCase() === clean);
        if (isAlreadySaved) {
          setSavedVocab(prev => prev.filter(v => v.word.toLowerCase() !== clean));
          showToast(`已從單字庫移除「${clean}」`, 'info');
        } else {
          const item = {
            id: Date.now().toString(),
            word: clean,
            translation: translation || '',
            date: new Date().toLocaleDateString('zh-TW'),
            sourceSentence: sourceSentence
          };
          setSavedVocab(prev => [item, ...prev]);
          showToast(`⭐ 已將「${clean}」加入單字庫！`, 'success');
        }
      };

      // Practice Word in Tab 3 (Deep Analysis)
      const handlePracticeWordInTab3 = (word) => {
        const clean = word.toLowerCase().replace(/[^a-z-]/g, '').trim();
        if (!clean) return;
        setWordPopover(null);
        setActiveTab('tab3');
        // Update tab3 input without clearing tab1/tab2
        setTabStates(prev => ({
          ...prev,
          tab3: { ...prev.tab3, input: clean }
        }));
        showToast(`已帶入「${clean}」至單字庫，正在啟動深度練習...`, 'info');
        handleGenerate(clean, 'tab3');
      };

      // Core Generation Function (Dual Mode with per-tab preservation)
      const handleGenerate = async (presetInput = null, targetTab = null) => {
        const activeT = targetTab || activeTab;
        const queryText = (presetInput !== null ? presetInput : tabStates[activeT]?.input || '').trim();
        if (!queryText) {
          setErrorMessage('請先輸入內容再開始生成！');
          return;
        }

        setErrorMessage('');
        setIsLoading(true);
        stopSpeech();

        // 1. Check if using Smart Keyless Engine (DEFAULT & RECOMMENDED)
        if (engineMode === 'smart' || !apiKey) {
          try {
            let parsedResult = null;
            if (activeT === 'tab1') {
              parsedResult = await SmartEngine.generateTab1(queryText);
            } else if (activeT === 'tab2') {
              parsedResult = await SmartEngine.generateTab2(queryText);
            } else if (activeT === 'tab3') {
              parsedResult = await SmartEngine.generateTab3(queryText);
            }

            // Save result to the specific tab
            setTabStates(prev => ({
              ...prev,
              [activeT]: { input: queryText, result: parsedResult }
            }));

            // Add to History
            const historyItem = {
              id: Date.now().toString(),
              timestamp: new Date().toISOString(),
              tab: activeT,
              input: queryText,
              result: parsedResult,
              starred: false
            };
            setHistory(prev => [historyItem, ...prev.filter(h => h.input !== queryText)]);
            showToast('免金鑰智慧引擎已為您生成學習卡！', 'success');
          } catch (err) {
            console.error('SmartEngine error:', err);
            setErrorMessage('生成遭遇問題，請稍候重試。');
          } finally {
            setIsLoading(false);
          }
          return;
        }

        // 2. Otherwise: Use Gemini API Mode (with Quota Tracking & Auto-Fallback)
        let systemPrompt = '';
        let userPrompt = '';

        if (activeT === 'tab1') {
          systemPrompt = `You are a world-class English teacher and translator. The user gives you a Chinese sentence.
You MUST respond with STRICT valid JSON matching this exact schema:
{
  "direct_translation": "Standard accurate English translation",
  "scenarios": {
    "professional": "Executive, formal business wording",
    "professional_zh": "Accurate Traditional Chinese translation of this professional sentence",
    "professional_tip": "Traditional Chinese usage tip explaining when and why to use this",
    "casual": "Natural, native everyday conversational wording with phrasal verbs",
    "casual_zh": "Accurate Traditional Chinese translation of this casual sentence",
    "casual_tip": "Traditional Chinese usage tip explaining when and why to use this",
    "advanced": "Idiomatic, sophisticated or high-score concise phrasing",
    "advanced_zh": "Accurate Traditional Chinese translation of this advanced sentence",
    "advanced_tip": "Traditional Chinese usage tip explaining when and why to use this"
  },
  "analysis": "Traditional Chinese (繁體中文) explanation of vocabulary choices, register nuances, and collocations."
}`;
          userPrompt = `多維度翻譯擴充以下中文內容，請確保各情境說法均附帶繁體中文翻譯與語境解析，輸出標準 JSON：\n"${queryText}"`;
        } else if (activeT === 'tab2') {
          systemPrompt = `You are an elite bilingual English editor and grammar mentor. The user gives you an English sentence.
You MUST respond with STRICT valid JSON matching this exact schema:
{
  "translation": "Accurate, fluent Traditional Chinese translation (no translationese)",
  "grammar_polish": {
    "original": "The user's original sentence",
    "corrected": "Polished English sentence",
    "issues": ["Traditional Chinese explanation of specific grammar mistake or Chinglish"],
    "explanation": "Traditional Chinese explanation on native writing intuition"
  },
  "alternatives": {
    "polite": "Diplomatic polite rephrasing (tactful, hedging)",
    "polite_zh": "Accurate Traditional Chinese translation of this polite sentence",
    "polite_tip": "Traditional Chinese usage tip",
    "direct": "Direct decisive rephrasing (punchy, action-oriented)",
    "direct_zh": "Accurate Traditional Chinese translation of this direct sentence",
    "direct_tip": "Traditional Chinese usage tip",
    "idiomatic": "Idiomatic native expression (collocations, figures of speech)",
    "idiomatic_zh": "Accurate Traditional Chinese translation of this idiomatic sentence",
    "idiomatic_tip": "Traditional Chinese usage tip"
  }
}`;
          userPrompt = `審核潤飾以下英文句子，為每種進階改寫版本提供繁體中譯與語境解析，輸出標準 JSON：\n"${queryText}"`;
        } else if (activeT === 'tab3') {
          systemPrompt = `You are an expert English vocabulary mentor and linguist.
The user provides one or more English words (separated by commas or newlines).
For EACH word, provide thorough IPA pronunciation, part of speech, authoritative English definition (definition_en), accurate Traditional Chinese definition (definition_zh), etymology / mnemonic memory hook, and 4 high-quality scenario sentences (Daily Social, Workplace, News, Academic) with the target word highlighted with **word**, Traditional Chinese translation, and usage tips.

You MUST respond with STRICT valid JSON matching this exact schema:
{
  "words": [
    {
      "deconstruction": {
        "word": "Target word",
        "ipa": "IPA notation like /ˌser.ənˈdɪp.ə.ti/",
        "part_of_speech": "e.g. noun [不可數]",
        "definition_en": "Authoritative native English dictionary definition (Oxford / Merriam-Webster style)",
        "definition_zh": "Accurate Traditional Chinese definition",
        "memory_hook": "Root/Prefix/Suffix etymology OR vivid mnemonic hook"
      },
      "contexts": [
        { "category": "日常社交 (Daily Social)", "sentence_en": "Natural English sentence with **word**", "sentence_zh": "Traditional Chinese", "tip": "Collocation or usage tip" },
        { "category": "職場溝通 (Workplace / Business)", "sentence_en": "Workplace English sentence with **word**", "sentence_zh": "Traditional Chinese", "tip": "Collocation or usage tip" },
        { "category": "新聞時事 (News / Current Affairs)", "sentence_en": "Journalistic English sentence with **word**", "sentence_zh": "Traditional Chinese", "tip": "Collocation or usage tip" },
        { "category": "學術/技術 (Academic / Technical)", "sentence_en": "Academic English sentence with **word**", "sentence_zh": "Traditional Chinese", "tip": "Collocation or usage tip" }
      ]
    }
  ]
}`;
          userPrompt = `深度剖析以下單字清單，為每個單字提供完整英文釋義(definition_en)、音標、詞性、繁中釋義、記憶訣竅與4種情境例句，輸出標準 JSON：\n"${queryText}"`;
        }

        try {
          const cleanKey = apiKey.trim();
          let primaryModel = (selectedModel || 'gemini-2.0-flash').replace(/^models\//, '').trim();

          // Prioritize primaryModel, followed by gemini-2.0-flash and gemini-1.5-flash
          const modelsToTry = [
            primaryModel,
            'gemini-2.0-flash',
            'gemini-1.5-flash'
          ].filter((m, i, arr) => m && arr.indexOf(m) === i);

          let resData = null;
          let lastErr = null;

          for (const modelName of modelsToTry) {
            try {
              // Canonical Gemini endpoint is ALWAYS v1beta
              const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${cleanKey}`;
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: `${systemPrompt}\n\n${userPrompt}` }] }],
                  generationConfig: { temperature: 0.3, responseMimeType: "application/json" }
                })
              });

              if (response.ok) {
                resData = await response.json();
                break;
              }

              const errData = await response.json().catch(() => ({}));
              const rawMsg = errData.error?.message || `HTTP ${response.status}`;
              console.warn(`Gemini API call to ${modelName} failed (${response.status}):`, rawMsg);

              // 1. Unrecoverable Auth / Key Errors -> STOP immediately and show real reason
              if (rawMsg.includes('API key not valid') || rawMsg.includes('API_KEY_INVALID')) {
                throw new Error('API Key 無效或未開通，請在「⚙️ 設定」中重新檢查金鑰');
              }
              if (response.status === 403 || rawMsg.includes('PERMISSION_DENIED') || rawMsg.includes('blocked')) {
                throw new Error('API Key 存取被拒 (403)，請確認 Google Cloud Console 未鎖定網址或 IP 限制');
              }
              if (rawMsg.includes('location') || rawMsg.includes('Location')) {
                throw new Error('目前連線地區不支援 Gemini API，請檢查網路或 VPN');
              }

              // 2. Rate Limit (429) -> If primary was 1.5-pro (2 RPM limit), fall back to 2.0-flash (15 RPM); otherwise stop
              if (response.status === 429 || rawMsg.includes('RESOURCE_EXHAUSTED')) {
                if (modelName.includes('pro')) {
                  console.warn('Pro model hit 2 RPM rate limit, attempting fallback to gemini-2.0-flash...');
                  lastErr = new Error('Gemini 1.5 Pro 已達 2 RPM 頻率上限 (429)');
                  continue; // Try gemini-2.0-flash next
                } else {
                  throw new Error('已達 Gemini 免費頻率限制 (429 Too Many Requests)，請稍候 30 秒再試');
                }
              }

              // 3. Fallback for generationConfig responseMimeType if 400
              if (response.status === 400 && (rawMsg.includes('responseMimeType') || rawMsg.includes('generationConfig'))) {
                const retryRes = await fetch(endpoint, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: `${systemPrompt}\n\nIMPORTANT: Return ONLY valid JSON format.\n\n${userPrompt}` }] }],
                    generationConfig: { temperature: 0.3 }
                  })
                });
                if (retryRes.ok) {
                  resData = await retryRes.json();
                  break;
                }
              }

              // 4. Overloaded (503 / 500) -> Wait 1 sec and try next model
              if (response.status === 503 || response.status === 500) {
                lastErr = new Error(`Google 伺服器尖峰繁忙 (${response.status})`);
                await new Promise(r => setTimeout(r, 1000));
                continue;
              }

              lastErr = new Error(rawMsg);
            } catch (networkErr) {
              lastErr = networkErr;
              if (networkErr.message.includes('API Key') || networkErr.message.includes('403') || networkErr.message.includes('429')) {
                throw networkErr; // Rethrow fatal errors immediately
              }
            }
          }

          if (!resData) {
            throw lastErr || new Error('Gemini API 連線未成功');

          // Record API usage & quota (Feature 4)

          const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error('API 未回傳內容');

          let parsed;
          try {
            parsed = JSON.parse(rawText);
          } catch {
            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (jsonMatch) parsed = JSON.parse(jsonMatch[0]);
            else throw new Error('無法解析 JSON');
          }

          setTabStates(prev => ({
            ...prev,
            [activeT]: { input: queryText, result: parsed }
          }));

          const historyItem = {
            id: Date.now().toString(),
            timestamp: new Date().toISOString(),
            tab: activeT,
            input: queryText,
            result: parsed,
            starred: false
          };
          setHistory(prev => [historyItem, ...prev.filter(h => h.input !== queryText)]);
          showToast('Gemini API 生成成功！已更新額度監控面板', 'success');

        } catch (err) {
          console.warn('Gemini API failed, falling back to SmartEngine:', err.message);
          showToast(`Gemini API 連線不順 (${err.message})，已自動切換免金鑰模式生成！`, 'info');
          
          let fallbackResult = null;
          if (activeT === 'tab1') fallbackResult = await SmartEngine.generateTab1(queryText);
          else if (activeT === 'tab2') fallbackResult = await SmartEngine.generateTab2(queryText);
          else if (activeT === 'tab3') fallbackResult = await SmartEngine.generateTab3(queryText);
          
          setTabStates(prev => ({
            ...prev,
            [activeT]: { input: queryText, result: fallbackResult }
          }));
        } finally {
          setIsLoading(false);
        }
      };

      // Load Quick Sample for current tab
      const handleLoadSample = () => {
        const sample = SAMPLE_DATA[activeTab];
        if (sample) {
          setTabStates(prev => ({
            ...prev,
            [activeTab]: { input: sample.prompt, result: sample.data }
          }));
          setErrorMessage('');
          showToast('已載入示範資料！各分頁狀態獨立保留不遺失', 'info');
        }
      };

      // Star / Unstar
      const toggleStar = (item) => {
        const isFav = favorites.some(f => f.input === item.input && f.tab === item.tab);
        if (isFav) {
          setFavorites(prev => prev.filter(f => !(f.input === item.input && f.tab === item.tab)));
          showToast('已取消收藏', 'info');
        } else {
          const newFav = { ...item, id: Date.now().toString(), starred: true };
          setFavorites(prev => [newFav, ...prev]);
          showToast('已加入收藏夾 ⭐', 'success');
        }
      };

      const isCurrentResultStarred = useMemo(() => {
        if (!currentResult || !currentInput) return false;
        return favorites.some(f => f.input === currentInput.trim() && f.tab === activeTab);
      }, [favorites, currentResult, currentInput, activeTab]);

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        showToast('已複製到剪貼簿 📋', 'success');
      };

      const exportJson = () => {
        const data = {
          exportDate: new Date().toISOString(),
          favorites,
          history,
          savedVocab,
          quotaStats
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `english_studio_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('已下載 JSON 備份檔', 'success');
      };

      const exportMarkdown = () => {
        let md = `# 📘 English AI Studio 學習筆記\n\n*匯出時間：${new Date().toLocaleString('zh-TW')}*\n\n---\n\n`;

        // Render saved vocabulary section
        if (savedVocab.length > 0) {
          md += `## 📖 我的單字庫 (${savedVocab.length})\n\n| 單字 | 繁體中譯 | 收藏日期 | 來源句子 |\n|---|---|---|---|\n`;
          savedVocab.forEach(v => {
            md += `| **${v.word}** | ${v.translation || '-'} | ${v.date || '-'} | *${v.sourceSentence || '-'}* |\n`;
          });
          md += `\n---\n\n`;
        }

        const renderItemMd = (item) => {
          let section = `### 【${item.tab === 'tab1' ? '中翻英擴充' : item.tab === 'tab2' ? '英翻中母語潤飾' : '單字深度練習'}】${item.input}\n\n`;
          if (item.tab === 'tab1') {
            section += `**核心直譯**：${item.result.direct_translation}\n\n`;
            section += `**多情境表達**：\n- 💼 **商務/正式**：${item.result.scenarios.professional}\n  *中譯*：${item.result.scenarios.professional_zh || ''}\n  💡 *${item.result.scenarios.professional_tip || ''}*\n- 💬 **道地口語**：${item.result.scenarios.casual}\n  *中譯*：${item.result.scenarios.casual_zh || ''}\n  💡 *${item.result.scenarios.casual_tip || ''}*\n- ✨ **進階/精煉**：${item.result.scenarios.advanced}\n  *中譯*：${item.result.scenarios.advanced_zh || ''}\n  💡 *${item.result.scenarios.advanced_tip || ''}*\n\n> **關鍵解析**：${item.result.analysis}\n\n`;

            item.result.grammar_polish.issues.forEach(iss => { section += `- ${iss}\n`; });

    // --- Sub-Component: Interactive Sentence Tokenizer ---
    function InteractiveSentenceText({ sentence, highlightWord, onWordInteract }) {
      if (!sentence) return null;

      // Extract parts respecting **word** bold markers
      const parts = sentence.split(/(\*\*.*?\*\*)/g);

      return (
        <span>
          {parts.map((segment, segIdx) => {
            const isBold = segment.startsWith('**') && segment.endsWith('**');
            const rawContent = isBold ? segment.slice(2, -2) : segment;

            // Split content into words and non-words
            const tokens = rawContent.split(/([a-zA-Z0-9'-]+)/g);

            return (
              <span key={segIdx} className={isBold ? "text-brand-600 dark:text-brand-400 font-bold" : ""}>
                {tokens.map((token, tokIdx) => {
                  const isWord = /^[a-zA-Z0-9'-]+$/.test(token) && /[a-zA-Z]/.test(token);
                  if (!isWord) return <span key={tokIdx}>{token}</span>;

                  return (
                    <span
                      key={tokIdx}
                      className="word-token"
                      onClick={(e) => onWordInteract && onWordInteract(token, e, sentence)}
                      title="點擊查詞並加入單字庫"
                    >
                      {token}
                    </span>
                  );
                })}
              </span>
            );
          })}
        </span>
      );
    }

    // --- Sub-Component: Blind Listening & Dictation Box Component ---
    function BlindSentenceBox({ sentence, blindMode, onPlay, highlightWord, onWordInteract }) {
      const [revealed, setRevealed] = useState(false);
      const [dictationInput, setDictationInput] = useState('');
      const [checkResult, setCheckResult] = useState(null);

      useEffect(() => {
        if (!blindMode) {
          setRevealed(false);
          setCheckResult(null);
        }
      }, [blindMode]);

      const handleCheckDictation = () => {
        if (!dictationInput.trim()) return;

        const normalize = (str) =>
          str.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().split(/\s+/).filter(Boolean);

        const targetWords = normalize(sentence);
        const userWords = normalize(dictationInput);

        if (targetWords.length === 0) return;

        let matches = 0;
        const diff = [];
        let uIdx = 0;

        targetWords.forEach((word) => {
          if (uIdx < userWords.length && userWords[uIdx] === word) {
            matches++;
            diff.push({ word, status: 'correct' });
            uIdx++;
          } else {
            diff.push({ word, status: 'missing' });
          }
        });

        const accuracy = Math.round((matches / targetWords.length) * 100);
        setCheckResult({ accuracy, diff });
      };

      if (!blindMode) {
        return (
          <p className="text-base sm:text-lg font-medium text-slate-800 dark:text-slate-100 leading-relaxed font-sans">
            <InteractiveSentenceText
              sentence={sentence}
              highlightWord={highlightWord}
              onWordInteract={onWordInteract}
            />
          </p>
        );
      }

      return (
        <div className="space-y-3">
          <div className="relative p-4 rounded-xl bg-slate-100/70 dark:bg-slate-900/70 border border-slate-200/80 dark:border-slate-800 overflow-hidden">
            <p className={`text-base sm:text-lg font-medium text-slate-800 dark:text-slate-100 leading-relaxed blind-blur ${revealed ? 'revealed' : ''}`}>
              <InteractiveSentenceText
                sentence={sentence}
                highlightWord={highlightWord}
                onWordInteract={onWordInteract}
              />
            </p>

            {!revealed && (
              <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/10 backdrop-blur-[6px] p-2 text-center">
                <span className="text-xs font-bold text-slate-700 dark:text-slate-300 mb-1 flex items-center gap-1.5">
                  <span>🎧 原文已遮蔽（聽力聽寫訓練中）</span>
                </span>
                <p className="text-[11px] text-slate-500 dark:text-slate-400">
                  先聽發音，在下方輸入聽寫，完成後揭曉答案！
                </p>
              </div>
            )}
          </div>

          <div className="space-y-2">
            <div className="flex gap-2">
              <input
                type="text"
                value={dictationInput}
                onChange={(e) => setDictationInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') {
                    e.preventDefault();
                    handleCheckDictation();
                  }
                }}
                placeholder="在此輸入您聽到的英文句子..."
                className="flex-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs sm:text-sm text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-brand-500 focus:outline-none"
              />
              <button
                type="button"
                onClick={handleCheckDictation}
                className="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold shadow-xs"
              >
                比對
              </button>
              <button
                type="button"
                onClick={() => setRevealed(!revealed)}
                className="px-3 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold"
              >
                {revealed ? '再次遮蔽' : '揭曉原文'}
              </button>
            </div>

            {checkResult && (
              <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs space-y-1.5 animate-fadeIn">
                <div className="flex items-center justify-between font-bold">
                  <span className={checkResult.accuracy >= 80 ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}>
                    🎯 聽寫準確率：{checkResult.accuracy}%
                  </span>
                  <span className="text-slate-400 font-normal">
                    {checkResult.accuracy === 100 ? '太神了！完全聽對！🎉' : '點擊「揭曉原文」對照漏聽單字'}
                  </span>
                </div>
                <div className="flex flex-wrap gap-1 pt-1">
                  {checkResult.diff.map((item, idx) => (
                    <span
                      key={idx}
                      className={`px-1.5 py-0.5 rounded text-[11px] font-mono ${
                        item.status === 'correct'
                          ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
                          : 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 line-through'
                      }`}
                    >
                      {item.word}
                    </span>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

      quotaStats,
      onClose,
      onSave,
      onTestSpeech,

    }) {
      const [modeInput, setModeInput] = useState(engineMode);
      const [keyInput, setKeyInput] = useState(apiKey);
      const [modelInput, setModelInput] = useState(selectedModel);
      const [rateInput, setRateInput] = useState(speechRate);
      const [accentInput, setAccentInput] = useState(speechAccent);
      const [showKey, setShowKey] = useState(false);
      const [isTestingApi, setIsTestingApi] = useState(false);
      const [testApiResult, setTestApiResult] = useState(null);

      const [availableModelsList, setAvailableModelsList] = useState([
        { id: 'gemini-2.0-flash', name: 'Gemini 2.0 Flash ⭐（首選推薦：次世代極速，額度 15 RPM / 1,500 RPD）' },
        { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash（穩健相容版，額度 15 RPM / 1,500 RPD）' },
        { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash（最新推理強化版）' },
        { id: 'gemini-1.5-pro', name: 'Gemini 1.5 Pro（深度複雜推理 ⚠️ 免費層限速 2 RPM，容易超額）' }
      ]);

      const handleDetectAndTestModels = async () => {
        if (!keyInput.trim()) {
          setTestApiResult({ ok: false, msg: '請先輸入 API Key 再進行偵測！' });
          return;
        }

        setIsTestingApi(true);
        setTestApiResult(null);

        const cleanKey = keyInput.trim();
        let detected = [];

        try {
          // Standard endpoint is ALWAYS v1beta
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${cleanKey}`);
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const rawMsg = errData.error?.message || `HTTP ${res.status}`;
            if (rawMsg.includes('API key not valid') || rawMsg.includes('API_KEY_INVALID')) {
              throw new Error('❌ API Key 無效，請至 Google AI Studio 重新複製金鑰（通常以 AIzaSy 開頭）');
            } else if (res.status === 403 || rawMsg.includes('blocked') || rawMsg.includes('PERMISSION_DENIED')) {
              throw new Error('❌ 存取受拒 (403)，此金鑰可能在 Google Cloud Console 被設定了網址或 IP 限制，請移除限制或加入當前網址');
            } else if (rawMsg.includes('location') || rawMsg.includes('Location')) {
              throw new Error('❌ 您所在的連線地區或 VPN 節點不支援 Gemini API');
            } else if (res.status === 429) {
              throw new Error('⚠️ 此 API Key 目前已觸發頻率限制 (429 Too Many Requests)，請稍候 30 秒再試');
            } else {
              throw new Error(`連線失敗：${rawMsg}`);
            }
          }

          const data = await res.json();
          if (Array.isArray(data.models)) {
            detected = data.models
              .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
              .map(m => {
                const id = m.name.replace(/^models\//, '');
                let label = m.displayName || id;
                if (id === 'gemini-2.0-flash') label += ' ⭐ (首選推薦・最新極速・15 RPM)';
                else if (id.includes('1.5-flash')) label += ' (穩健高額度・15 RPM)';
                else if (id.includes('pro')) label += ' (深度推理・⚠️限速 2 RPM 易超額)';
                return { id, name: `${label} [${id}]` };
              });
          }

          if (detected.length > 0) {
            setAvailableModelsList(detected);
            const hasCurrent = detected.some(m => m.id === modelInput.replace(/^models\//, ''));
            if (!hasCurrent || modelInput.includes('1.5-pro')) {
              const best = detected.find(m => m.id === 'gemini-2.0-flash') ||
                           detected.find(m => m.id.includes('2.0-flash')) ||
                           detected.find(m => m.id === 'gemini-1.5-flash') ||
                           detected[0];
              setModelInput(best.id);
            }
            setTestApiResult({
              ok: true,
              msg: `✅ 驗證成功！已成功連線 Google AI Studio，偵測到 ${detected.length} 個可用模型，已自動為您選定推薦的高配額極速模型！`
            });
            return;
          }

          // Single ping test with gemini-2.0-flash
          const testRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${cleanKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: "ping" }] }],
              generationConfig: { maxOutputTokens: 2 }
            })
          });
          if (testRes.ok) {
            setModelInput('gemini-2.0-flash');
            setTestApiResult({
              ok: true,
              msg: `✅ 連線成功！已自動驗證並套用最新極速模型：gemini-2.0-flash`
            });
          } else {
            const errData = await testRes.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP ${testRes.status}`);
          }

        } catch (err) {
          setTestApiResult({
            ok: false,
            msg: `${err.message}。若持續失敗，可隨時切換回「🟢 免金鑰模式」！`
          });
        } finally {
          setIsTestingApi(false);
        }
      };

      return (

          <div className="glass-card w-full max-w-lg rounded-3xl border border-slate-200 dark:border-slate-800 p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">

                <Icon name="x" className="w-5 h-5" />

            </div>

            <div className="space-y-4 text-xs sm:text-sm">
              
              {/* 1. Mode Switcher (Smart Keyless vs Gemini API) */}

                <label className="font-bold text-slate-800 dark:text-slate-200 block mb-2">

                      <span>🟢 免金鑰模式 (推薦)</span>

    // --- Resilient Error Boundary ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error('English AI Studio Caught Error:', error, errorInfo);
      }

      handleResetState = () => {
        try {
          localStorage.removeItem('english_studio_tab_states');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(reg => reg.update());
            });
          }
        } catch (e) {
          console.error(e);
        }
        window.location.reload();
      };

      handleFullRepair = async () => {
        try {
          localStorage.removeItem('english_studio_tab_states');
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister()));
          }
        } catch (e) {
          console.error('Repair error:', e);
        }
        window.location.href = window.location.pathname + '?nocache=' + Date.now();
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
              <div className="max-w-md w-full bg-slate-800/95 border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl text-center space-y-5">
                <div className="w-16 h-16 mx-auto rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-3xl shadow-inner">
                  🛡️
                </div>
                <div className="space-y-2">
                  <h2 className="text-xl font-bold text-white">應用程式載入中遇到了問題</h2>
                  <p className="text-xs text-slate-400 leading-relaxed">
                    可能是暫存的歷史頁面資料格式不相容或舊版快取衝突。點擊下方按鈕即可自動自我修復並重新載入！
                  </p>
                </div>

                <div className="space-y-2.5 pt-2">
                  <button
                    onClick={this.handleResetState}
                    className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 hover:from-indigo-600 hover:to-purple-700 transition active:scale-[0.98]"
                  >
                    🔄 快速修復並重新載入
                  </button>

                  <button
                    onClick={this.handleFullRepair}
                    className="w-full py-2.5 px-4 rounded-xl bg-slate-700/60 hover:bg-slate-700 text-slate-300 font-medium text-xs border border-slate-600/50 transition active:scale-[0.98]"
                  >
                    🧹 徹底清除快取並重啟 (一鍵自我修復)
                  </button>
                </div>

                {this.state.error && (
                  <details className="text-left bg-slate-950/60 rounded-xl p-3 text-[11px] text-red-400 font-mono overflow-auto max-h-32 border border-red-500/20">
                    <summary className="cursor-pointer text-slate-400 hover:text-slate-200 mb-1 select-none font-sans font-medium">
                      查看錯誤詳情
                    </summary>
                    <pre className="whitespace-pre-wrap">{String(this.state.error?.stack || this.state.error?.message || this.state.error)}</pre>
                  </details>
                )}
              </div>
            </div>
          );
        }

        return this.props.children;
      }
    }

    // --- Render Application Root ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
