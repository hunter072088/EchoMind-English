    // --- Audio Service (Enhanced Dual-Engine: Stream Audio + Background Carrier + Web Speech Fallback) ---
    class AudioService {
      static activeUtterance = null;
      static fallbackTimer = null;
      static speechAudio = null;
      static carrierAudio = null;
      static isBackgroundMode = true;
      static wakeLockSentinel = null;
      static silentAudioUrl = null;

      static initAudio() {
        if (!this.silentAudioUrl) {
          this.silentAudioUrl = this.createSilentAudioUrl();
        }
        if (!this.carrierAudio && typeof Audio !== 'undefined') {
          try {
            this.carrierAudio = new Audio(this.silentAudioUrl);
            this.carrierAudio.setAttribute('playsinline', 'true');
            this.carrierAudio.setAttribute('webkit-playsinline', 'true');
            this.carrierAudio.loop = true;
            this.carrierAudio.volume = 0.001; // barely audible carrier track to keep OS audio session active
          } catch (e) {
            console.warn('Carrier audio init notice:', e);
          }
        }
        if (!this.speechAudio && typeof Audio !== 'undefined') {
          try {
            this.speechAudio = new Audio();
            this.speechAudio.setAttribute('playsinline', 'true');
            this.speechAudio.setAttribute('webkit-playsinline', 'true');
          } catch (e) {
            console.warn('Speech audio init notice:', e);
          }
        }
      }

      // 1-second 8kHz 8-bit mono silent WAV Blob (pure offline client-side synthesis)
      static createSilentAudioUrl() {
        try {
          const sampleRate = 8000;
          const numSamples = sampleRate;
          const buffer = new Uint8Array(44 + numSamples);
          const view = new DataView(buffer.buffer);
          view.setUint32(0, 0x52494646, false); // "RIFF"
          view.setUint32(4, 36 + numSamples, true);
          view.setUint32(8, 0x57415645, false); // "WAVE"
          view.setUint32(12, 0x666d7420, false); // "fmt "
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true); // PCM
          view.setUint16(22, 1, true); // Mono
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate, true);
          view.setUint16(32, 1, true);
          view.setUint16(34, 8, true);
          view.setUint32(36, 0x64617461, false); // "data"
          view.setUint32(40, numSamples, true);
          for (let i = 0; i < numSamples; i++) {
            buffer[44 + i] = 128; // PCM 8-bit midpoint = silence
          }
          const blob = new Blob([buffer], { type: 'audio/wav' });
          return URL.createObjectURL(blob);
        } catch (e) {
          return 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
        }
      }

      // TTS Stream URL Generator (Google Translate High-Quality Audio Stream)
      static getTtsUrl(text, lang = 'en-US') {
        const langCode = (lang.includes('GB') || lang.includes('UK')) ? 'en-GB' : 'en-US';
        const cleanText = text.replace(/[\/\(\)\*]/g, ' ').trim().slice(0, 200);
        return `https://translate.google.com/translate_tts?ie=UTF-8&tl=${langCode}&client=tw-ob&q=${encodeURIComponent(cleanText)}`;
      }

      // Start Mobile Background Persistence Mode
      static async startBackgroundCarrier() {
        this.initAudio();
        if (this.carrierAudio) {
          try {
            await this.carrierAudio.play();
          } catch (e) {
            console.warn('Carrier play notice:', e);
          }
        }
        this.requestWakeLock();
      }

      // Stop Background Persistence Mode
      static stopBackgroundCarrier() {
        if (this.carrierAudio) {
          try {
            this.carrierAudio.pause();
          } catch (e) {}
        }
        this.releaseWakeLock();
      }

      static async requestWakeLock() {
        if ('wakeLock' in navigator && !this.wakeLockSentinel) {
          try {
            this.wakeLockSentinel = await navigator.wakeLock.request('screen');
            this.wakeLockSentinel.addEventListener('release', () => {
              this.wakeLockSentinel = null;
            });
          } catch (e) {}
        }
      }

      static releaseWakeLock() {
        if (this.wakeLockSentinel) {
          try {
            this.wakeLockSentinel.release();
          } catch (e) {}
          this.wakeLockSentinel = null;
        }
      }

      // Update Mobile Lock Screen & Control Center Info
      static updateMediaSession(info = {}, onActions = {}) {
        if (!('mediaSession' in navigator)) return;
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: info.title || 'EchoMind English',
            artist: info.artist || '英文式思考與 Shadowing 跟讀訓練器',
            album: info.album || '100 天道地語塊磨耳朵',
            artwork: [
              { src: './assets/icon-192.png', sizes: '192x192', type: 'image/png' },
              { src: './assets/icon-512.png', sizes: '512x512', type: 'image/png' }
            ]
          });
          navigator.mediaSession.playbackState = 'playing';

          if (onActions.play) navigator.mediaSession.setActionHandler('play', onActions.play);
          if (onActions.pause) navigator.mediaSession.setActionHandler('pause', onActions.pause);
          if (onActions.nexttrack) navigator.mediaSession.setActionHandler('nexttrack', onActions.nexttrack);
          if (onActions.previoustrack) navigator.mediaSession.setActionHandler('previoustrack', onActions.previoustrack);
        } catch (e) {
          console.warn('MediaSession notice:', e);
        }
      }

      static updateMediaPlaybackState(state = 'none') {
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.playbackState = state;
          } catch (e) {}
        }
      }

      static speak(text, options = {}) {
        this.initAudio();
        this.stop(); // Stop any ongoing speech

        const preferStream = options.preferStream !== false;

        // Keep carrier audio active during intervals
        if (this.carrierAudio && this.isBackgroundMode) {
          this.carrierAudio.play().catch(() => {});
        }

        if (preferStream && this.speechAudio) {
          let hasFinished = false;
          const finish = (isError = false) => {
            if (hasFinished) return;
            hasFinished = true;
            if (this.fallbackTimer) {
              clearTimeout(this.fallbackTimer);
              this.fallbackTimer = null;
            }
            // Ensure carrier continues to loop in the background during pause intervals!
            if (this.carrierAudio && this.isBackgroundMode) {
              this.carrierAudio.play().catch(() => {});
            }
            if (isError && options.onError) options.onError();
            else if (!isError && options.onEnd) options.onEnd();
          };

          this.speechAudio.onended = () => finish(false);
          this.speechAudio.onerror = (err) => {
            console.warn('TTS Stream playback failed, falling back to Web Speech API:', err);
            this.speakWebSpeech(text, options);
          };

          const ttsUrl = this.getTtsUrl(text, options.lang || 'en-US');
          this.speechAudio.src = ttsUrl;
          this.speechAudio.playbackRate = options.rate || 1.0;

          // Safety fallback timer
          const approxDurationMs = Math.max(3000, (text.length / 6) * 1000 + 4000);
          this.fallbackTimer = setTimeout(() => {
            if (!hasFinished) {
              finish(false);
            }
          }, approxDurationMs);

          this.speechAudio.play().then(() => {
            if (options.onStart) options.onStart();
          }).catch(err => {
            console.warn('Audio play prevented or offline, fallback to SpeechSynthesis:', err);
            this.speakWebSpeech(text, options);
          });

          return;
        }

        this.speakWebSpeech(text, options);
      }

      static speakWebSpeech(text, options = {}) {
        if (!('speechSynthesis' in window)) return;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = options.rate || 1.0;
        utterance.pitch = options.pitch || 1.0;
        utterance.lang = options.lang || 'en-US';

        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.startsWith(utterance.lang) && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Daniel')));
        if (preferredVoice) utterance.voice = preferredVoice;

        let hasFinished = false;
        const finish = (isError = false) => {
          if (hasFinished) return;
          hasFinished = true;
          if (this.fallbackTimer) {
            clearTimeout(this.fallbackTimer);
            this.fallbackTimer = null;
          }
          this.activeUtterance = null;
          if (isError && options.onError) options.onError();
          else if (!isError && options.onEnd) options.onEnd();
        };

        utterance.onstart = () => {
          if (options.onStart) options.onStart();
        };
        utterance.onend = () => finish(false);
        utterance.onerror = (e) => {
          console.warn('Speech synthesis notice:', e);
          finish(true);
        };

        this.activeUtterance = utterance;

        const approxDurationMs = Math.max(3000, (text.length / 8) * 1000 + 3500);
        this.fallbackTimer = setTimeout(() => {
          if (!hasFinished) finish(false);
        }, approxDurationMs);

        window.speechSynthesis.speak(utterance);
      }

      static stop() {
        if (this.fallbackTimer) {
          clearTimeout(this.fallbackTimer);
          this.fallbackTimer = null;
        }
        if (this.speechAudio) {
          try {
            this.speechAudio.pause();
            this.speechAudio.currentTime = 0;
          } catch (e) {}
        }
        this.activeUtterance = null;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }
    }

    // =========================================================================
    // 模組一：Chunk 每日精選與高效輸入 (10 Chunks/Day)
    // =========================================================================
    function ModuleChunks({ allChunks, userState, settings, onStartShadowing, onToggleStar, onToggleMastered, onInstallClick, isStandalone }) {
      const [selectedDay, setSelectedDay] = useState(1);
      const [selectedPhase, setSelectedPhase] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [cefrFilter, setCefrFilter] = useState('all'); // 'all', 'A2', 'B1'
      const [playingChunkId, setPlayingChunkId] = useState(null);

      // --- Multi-Select & Continuous Playback State ---
      const [selectedChunkIds, setSelectedChunkIds] = useState([]);
      const [isSelectMode, setIsSelectMode] = useState(false);

      // Playback Preferences
      const [repeatCount, setRepeatCount] = useState(2); // 1, 2, 3, 5, Infinity (無限次)
      const [isLoopPlaylist, setIsLoopPlaylist] = useState(true); // 預設開啟清單循環（播完自動重新循環，實現黑屏無限背景聽）
      const [pauseInterval, setPauseInterval] = useState(1.5); // 1.0s, 1.5s, 2.0s, 3.0s
      const [continuousRate, setContinuousRate] = useState(settings.defaultRate || 1.0);
      const [playContentMode, setPlayContentMode] = useState('chunk_only'); // 'chunk_only' | 'chunk_and_dialogue'

      // Continuous Player Runtime State
      const [continuousPlayer, setContinuousPlayer] = useState({
        isActive: false,
        isPaused: false,
        playlist: [],
        currentIndex: 0,
        currentRepeat: 1,
        status: 'idle', // 'speaking' | 'pausing' | 'paused' | 'idle'
      });

      const continuousTimeoutRef = useRef(null);
      const continuousPlayerRef = useRef(continuousPlayer);
      continuousPlayerRef.current = continuousPlayer;

      const repeatCountRef = useRef(repeatCount);
      repeatCountRef.current = repeatCount;

      const isLoopPlaylistRef = useRef(isLoopPlaylist);
      isLoopPlaylistRef.current = isLoopPlaylist;

      const pauseIntervalRef = useRef(pauseInterval);
      pauseIntervalRef.current = pauseInterval;

      const continuousRateRef = useRef(continuousRate);
      continuousRateRef.current = continuousRate;

      const playContentModeRef = useRef(playContentMode);
      playContentModeRef.current = playContentMode;

      // Stop speech & timers on unmount
      useEffect(() => {
        return () => {
          if (continuousTimeoutRef.current) clearTimeout(continuousTimeoutRef.current);
          AudioService.stop();
        };
      }, []);

      // Get day chunks from master database engine
      const currentDayChunks = useMemo(() => {
        if (selectedDay === 'all') {
          return allChunks;
        }
        if (window.ECHOMIND_MASTER_DB && window.ECHOMIND_MASTER_DB.getChunksForDay) {
          return window.ECHOMIND_MASTER_DB.getChunksForDay(selectedDay);
        }
        return allChunks.filter(c => c.day === selectedDay);
      }, [selectedDay, allChunks]);

      // Filtered chunks
      const filteredChunks = useMemo(() => {
        return currentDayChunks.filter(c => {
          const matchCefr = cefrFilter === 'all' || (c.cefr === cefrFilter) || (!c.cefr && (cefrFilter === 'A2' ? c.day <= 40 : c.day > 40));
          const matchCat = categoryFilter === 'all' || c.category === categoryFilter;
          const matchQuery = !searchQuery || 
            c.text.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.situationalMeaning.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.literalMeaning.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCefr && matchCat && matchQuery;
        });
      }, [currentDayChunks, cefrFilter, categoryFilter, searchQuery]);

      // Multi-Select helpers
      const toggleSelectChunk = (chunkId) => {
        setSelectedChunkIds(prev => {
          const exists = prev.includes(chunkId);
          const next = exists ? prev.filter(id => id !== chunkId) : [...prev, chunkId];
          if (next.length > 0 && !isSelectMode) {
            setIsSelectMode(true);
          }
          return next;
        });
      };

      const selectAllFiltered = () => {
        const ids = filteredChunks.map(c => c.id);
        setSelectedChunkIds(prev => Array.from(new Set([...prev, ...ids])));
        setIsSelectMode(true);
      };

      const clearSelection = () => {
        setSelectedChunkIds([]);
      };

      // Play individual Chunk
      const handlePlayChunk = (chunk, rate = settings.defaultRate) => {
        if (continuousPlayerRef.current.isActive) {
          stopContinuous();
        }
        setPlayingChunkId(chunk.id);
        AudioService.updateMediaSession({
          title: chunk.text,
          artist: chunk.situationalMeaning || 'EchoMind English',
          album: `Day ${chunk.day} • ${chunk.cefr || 'A2'} 實戰語塊`
        });
        AudioService.speak(chunk.text, {
          rate: rate,
          lang: settings.accent,
          chunk: chunk,
          onEnd: () => setPlayingChunkId(null),
          onError: () => setPlayingChunkId(null)
        });
      };

      // Continuous Playback Execution
      const playContinuousItem = (playlist, index, repeat) => {
        if (!playlist || playlist.length === 0 || index >= playlist.length) {
          stopContinuous();
          return;
        }

        const chunk = playlist[index];
        setPlayingChunkId(chunk.id);
        setContinuousPlayer(prev => ({
          ...prev,
          isActive: true,
          isPaused: false,
          playlist,
          currentIndex: index,
          currentRepeat: repeat,
          status: 'speaking'
        }));

        // Smooth scroll to card
        setTimeout(() => {
          const cardEl = document.getElementById('chunk-card-' + chunk.id);
          if (cardEl) {
            cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 50);

        // Determine utterance text
        let textToSpeak = chunk.text;
        if (playContentModeRef.current === 'chunk_and_dialogue' && chunk.dialogue) {
          const exampleText = chunk.dialogue.speakerB || chunk.dialogue.speakerA || '';
          textToSpeak = `${chunk.text}. Example: ${exampleText}`;
        }

        // Update Phone Lock Screen, Dynamic Island & Headphone Controls
        AudioService.updateMediaSession({
          title: chunk.text,
          artist: `${chunk.situationalMeaning || ''} (跟讀第 ${repeat} 次)`,
          album: `Day ${chunk.day || selectedDay} • ${chunk.cefr || 'A2'} 語塊 (${index + 1}/${playlist.length})`
        }, {
          play: () => resumeContinuous(),
          pause: () => pauseContinuous(),
          nexttrack: () => nextContinuousItem(),
          previoustrack: () => prevContinuousItem()
        });

        AudioService.speak(textToSpeak, {
          rate: continuousRateRef.current,
          lang: settings.accent,
          chunk: chunk,
          onEnd: () => handleContinuousItemEnd(playlist, index, repeat),
          onError: () => handleContinuousItemEnd(playlist, index, repeat)
        });
      };

      const handleContinuousItemEnd = (playlist, index, repeat) => {
        if (!continuousPlayerRef.current.isActive || continuousPlayerRef.current.isPaused) {
          return;
        }

        setContinuousPlayer(prev => ({ ...prev, status: 'pausing' }));

        // Critical for iOS / Android background loop: keep audio carrier active during pause gap
        AudioService.startBackgroundCarrier();

        if (continuousTimeoutRef.current) {
          clearTimeout(continuousTimeoutRef.current);
        }

        continuousTimeoutRef.current = setTimeout(() => {
          if (!continuousPlayerRef.current.isActive || continuousPlayerRef.current.isPaused) {
            return;
          }

          if (repeatCountRef.current === Infinity || repeat < repeatCountRef.current) {
            // Repeat this item again for shadowing (infinite loop or next repeat)
            playContinuousItem(playlist, index, repeat + 1);
          } else {
            // Advance to next chunk in playlist
            const nextIndex = index + 1;
            if (nextIndex < playlist.length) {
              playContinuousItem(playlist, nextIndex, 1);
            } else if (isLoopPlaylistRef.current && playlist.length > 0) {
              // Reached end of playlist, loop back to the start! (無限清單循環)
              playContinuousItem(playlist, 0, 1);
            } else {
              // Completed all!
              stopContinuous();
            }
          }
        }, pauseIntervalRef.current * 1000);
      };

      const startContinuous = (playlistToPlay, startIndex = 0) => {
        if (!playlistToPlay || playlistToPlay.length === 0) return;
        if (continuousTimeoutRef.current) clearTimeout(continuousTimeoutRef.current);
        AudioService.stop();

        // Start background persistence audio carrier immediately upon user click
        AudioService.startBackgroundCarrier();

        setContinuousPlayer({
          isActive: true,
          isPaused: false,
          playlist: playlistToPlay,
          currentIndex: startIndex,
          currentRepeat: 1,
          status: 'speaking'
        });

        playContinuousItem(playlistToPlay, startIndex, 1);
      };

      const pauseContinuous = () => {
        if (continuousTimeoutRef.current) clearTimeout(continuousTimeoutRef.current);
        AudioService.stop();
        AudioService.updateMediaPlaybackState('paused');
        setPlayingChunkId(null);
        setContinuousPlayer(prev => ({ ...prev, isPaused: true, status: 'paused' }));
      };

      const resumeContinuous = () => {
        const { playlist, currentIndex, currentRepeat } = continuousPlayerRef.current;
        if (playlist.length > 0) {
          AudioService.startBackgroundCarrier();
          playContinuousItem(playlist, currentIndex, currentRepeat);
        }
      };

      const nextContinuousItem = () => {
        if (continuousTimeoutRef.current) clearTimeout(continuousTimeoutRef.current);
        AudioService.stop();
        const { playlist, currentIndex } = continuousPlayerRef.current;
        if (currentIndex + 1 < playlist.length) {
          playContinuousItem(playlist, currentIndex + 1, 1);
        } else if (isLoopPlaylistRef.current && playlist.length > 0) {
          // Loop back to start
          playContinuousItem(playlist, 0, 1);
        } else {
          stopContinuous();
        }

      const prevContinuousItem = () => {
        if (continuousTimeoutRef.current) clearTimeout(continuousTimeoutRef.current);
        AudioService.stop();
        const { playlist, currentIndex } = continuousPlayerRef.current;
        const prevIndex = currentIndex > 0 ? currentIndex - 1 : (isLoopPlaylistRef.current && playlist.length > 0 ? playlist.length - 1 : 0);
        playContinuousItem(playlist, prevIndex, 1);

        if (continuousTimeoutRef.current) clearTimeout(continuousTimeoutRef.current);
        AudioService.stop();
        AudioService.stopBackgroundCarrier();

        setPlayingChunkId(null);

      const [isRecording, setIsRecording] = useState(false);
      const [recordedAudioUrl, setRecordedAudioUrl] = useState(null);
      const [isPlayingUserAudio, setIsPlayingUserAudio] = useState(false);
      const [recordingTime, setRecordingTime] = useState(0);
      const [speechAccuracy, setSpeechAccuracy] = useState(null);
      const [recognizedText, setRecognizedText] = useState('');
      const [countdown, setCountdown] = useState(null);

      const mediaRecorderRef = useRef(null);
      const audioChunksRef = useRef([]);
      const timerRef = useRef(null);
      const userAudioRef = useRef(null);
      const recognitionRef = useRef(null);
      const canvasRef = useRef(null);
      const audioContextRef = useRef(null);
      const analyserRef = useRef(null);
      const animationFrameRef = useRef(null);

      if (!chunk) {
        chunk = allChunks[0];
      }

      // Cleanup on unmount or chunk change
      useEffect(() => {
        setIsRecording(false);
        setRecordedAudioUrl(null);
        setSpeechAccuracy(null);
        setRecognizedText('');
        setCurrentStage(1);
        setIsBlindMasked(true);
        if (timerRef.current) clearInterval(timerRef.current);
        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
          mediaRecorderRef.current.stop();
        }
        if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
      }, [chunk?.id]);

      // Play Native TTS Audio
      const playNativeAudio = (rate = playbackRate) => {
        setIsPlayingNative(true);
        AudioService.speak(chunk.text, {
          rate: rate,
          lang: settings.accent,
          onEnd: () => setIsPlayingNative(false),
          onError: () => setIsPlayingNative(false)
        });
      };

      // Start Synchronized Echo Countdown (Stage 2)
      const startEchoSyncCountdown = () => {
        setCountdown(3);
        const countTimer = setInterval(() => {
          setCountdown(prev => {
            if (prev === 1) {
              clearInterval(countTimer);
              // Start native audio + start user recording
              playNativeAudio(playbackRate);
              startMicrophoneRecording();
              return null;
            }
            return prev - 1;
          });
        }, 800);
      };

      // Live Microphone Recording using MediaRecorder + Web Audio Analyser
      const startMicrophoneRecording = async () => {
        try {
          audioChunksRef.current = [];
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          // Setup Web Audio analyser for live waveform visualizer
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioContextRef.current = audioCtx;
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyserRef.current = analyser;
          const source = audioCtx.createMediaStreamSource(stream);
          source.connect(analyser);

          drawWaveform();

          const recorder = new MediaRecorder(stream);
          mediaRecorderRef.current = recorder;

          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunksRef.current.push(e.data);
          };

          recorder.onstop = () => {
            const blob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            setRecordedAudioUrl(url);
            stream.getTracks().forEach(track => track.stop());
            if (animationFrameRef.current) cancelAnimationFrame(animationFrameRef.current);
          };

          // Setup Web Speech Recognition for Real-time Text matching
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = settings.accent;
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
              const transcript = event.results[0][0].transcript;
              setRecognizedText(transcript);
              calculateAccuracy(transcript, chunk.text);
            };

            recognition.onerror = (e) => {
              console.log('Speech recognition notice:', e.error);
            };

            recognitionRef.current = recognition;
            try { recognition.start(); } catch(err){}
          }

          recorder.start();
          setIsRecording(true);
          setRecordingTime(0);

          timerRef.current = setInterval(() => {
            setRecordingTime(t => t + 1);
          }, 1000);

        } catch (err) {
          alert('請允許瀏覽器麥克風存取權限，以體驗錄音與發音對比功能！');
          console.error(err);
        }
      };

      // Stop Microphone Recording
      const stopMicrophoneRecording = () => {
        if (mediaRecorderRef.current && isRecording) {
          mediaRecorderRef.current.stop();
          setIsRecording(false);
          if (timerRef.current) clearInterval(timerRef.current);
          if (recognitionRef.current) {
            try { recognitionRef.current.stop(); } catch(e){}
          }
          // Mark shadowing session completed
          onCompleteSession();
        }
      };

      // Draw real-time Canvas Waveform
      const drawWaveform = () => {
        const canvas = canvasRef.current;
        if (!canvas || !analyserRef.current) return;
        const ctx = canvas.getContext('2d');
        const bufferLength = analyserRef.current.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        const renderFrame = () => {
          animationFrameRef.current = requestAnimationFrame(renderFrame);
          analyserRef.current.getByteFrequencyData(dataArray);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const barWidth = (canvas.width / bufferLength) * 2.5;
          let barHeight;
          let x = 0;

          for (let i = 0; i < bufferLength; i++) {
            barHeight = (dataArray[i] / 255) * canvas.height;
            ctx.fillStyle = `rgb(16, 185, 129)`;
            ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
            x += barWidth + 1;
          }
        };
        renderFrame();
      };

      // Calculate string matching accuracy
      const calculateAccuracy = (spoken, target) => {
        const cleanSpoken = spoken.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ');
        const cleanTarget = target.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(' ');
        let matchCount = 0;
        cleanTarget.forEach(word => {
          if (cleanSpoken.includes(word)) matchCount++;
        });
        const score = Math.round((matchCount / cleanTarget.length) * 100);
        setSpeechAccuracy(score);
      };

      // Play Recorded Audio
      const playUserAudio = () => {
        if (!recordedAudioUrl) return;
        if (userAudioRef.current) {
          userAudioRef.current.pause();
          userAudioRef.current.currentTime = 0;
        }
        const audio = new Audio(recordedAudioUrl);
        userAudioRef.current = audio;
        setIsPlayingUserAudio(true);
        audio.play();
        audio.onended = () => setIsPlayingUserAudio(false);
        audio.onerror = () => setIsPlayingUserAudio(false);
      };

      return (
        <div className="space-y-6">
          {/* Top Switcher Bar */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🎙️</span>
              <div>
                <h2 className="font-display font-extrabold text-base sm:text-lg text-slate-900 dark:text-white">
                  Shadowing Studio 影子跟讀工坊
                </h2>
                <p className="text-xs text-slate-500">
                  耳朵抓節奏 ➔ 口腔肌肉記憶 ➔ 免看逐字稿獨立盲說
                </p>
              </div>
            </div>

            {/* Quick Chunk Picker dropdown */}

              <label className="text-xs font-semibold text-slate-500">切換句型:</label>
              <select

                className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 border-none text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-brand-500"
              >

            {[
              { num: 1, title: '階段 1: 聽音辨識', subtitle: '純盲聽抓語感節奏', icon: 'headphones' },
              { num: 2, title: '階段 2: 同步跟讀', subtitle: '0.2秒口腔同步跟隨', icon: 'repeat' },
              { num: 3, title: '階段 3: 獨立盲說', subtitle: '無音檔肌肉記憶輸出', icon: 'mic' }

                <button

                  }`}

                    <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${isActive ? 'bg-brand-600 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-500'}`}>

          </div>

          {/* Studio Interactive Deck */}
          <div className="p-6 sm:p-10 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl space-y-8">
            
            {/* Top Stage Instructions */}
            <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-4">

                {currentStage === 1 && "【階段 1】閉上眼睛聽 3 次，大腦預測母語者的音調起伏與連音形變。"}

                {currentStage === 3 && "【階段 3】完全不聽音檔，靠口腔慣性獨立唸出並錄音對比！"}
              </div>

              {/* Mask / Reveal text toggle */}
              <button

                <Icon name={isBlindMasked ? "eye" : "eyeOff"} className="w-4 h-4" />

            {/* Target Chunk Focus Display */}
            <div className="text-center py-6 sm:py-10 space-y-4">

              {/* Fast Speech Shape & Phonetics */}

            {/* Live Audio Visualizer Canvas */}
            <div className="bg-slate-950 rounded-2xl p-4 flex flex-col items-center justify-center relative overflow-hidden h-28 border border-slate-800">
              <canvas ref={canvasRef} width="400" height="80" className="w-full h-full max-w-md"></canvas>
              
              {!isRecording && !isPlayingNative && (
                <div className="absolute inset-0 flex items-center justify-center bg-slate-950/80 text-xs font-mono text-slate-400">
                  <span>🎧 音波監測待命中 • 播放或錄音時即時顯示聲波</span>
                </div>
              )}

              {isPlayingNative && (
                <div className="absolute top-2 left-3 flex items-center gap-1.5 text-[10px] font-bold text-brand-400 uppercase tracking-wider">
                  <span className="w-2 h-2 rounded-full bg-brand-400 animate-pulse"></span>
                  <span>原音節奏輸出中...</span>
                </div>
              )}

              {isRecording && (
                <div className="absolute top-2 left-3 flex items-center gap-1.5 text-[10px] font-bold text-red-400 uppercase tracking-wider">
                  <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                  <span>麥克風錄音中 ({recordingTime}s)...</span>
                </div>
              )}
            </div>

            {/* Countdown Overlay for Stage 2 */}
            {countdown !== null && (
              <div className="py-4 text-center">
                <div className="inline-block px-8 py-4 rounded-3xl bg-brand-600 text-white font-display font-black text-5xl shadow-2xl animate-bounce">
                  {countdown}
                </div>
                <p className="text-xs font-bold text-brand-600 mt-2">準備好！倒數結束後母語音檔響起，立即跟隨出聲！</p>
              </div>
            )}

            {/* Stage-Specific Audio Controls */}
            <div className="flex flex-wrap items-center justify-center gap-3 pt-2">
              
              {/* Native Audio Button with Speed Switcher */}
              <div className="inline-flex rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 p-1 shadow-sm">
                <button

                  className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition ${
                    isPlayingNative ? 'bg-amber-500 text-white' : 'bg-brand-600 hover:bg-brand-700 text-white shadow-md'
                  }`}
                >
                  <Icon name={isPlayingNative ? "pause" : "play"} className="w-4 h-4" />
                  <span>{isPlayingNative ? "播放中..." : "播放原音 (Native)"}</span>
                </button>

                {[0.75, 1.0, 1.25].map(rate => (
                  <button
                    key={rate}
                    onClick={() => {
                      setPlaybackRate(rate);
                      playNativeAudio(rate);
                    }}
                    className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition ${
                      playbackRate === rate
                        ? 'bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-300 shadow-sm'
                        : 'text-slate-500 hover:text-slate-800 dark:hover:text-white'
                    }`}
                  >
                    {rate}x
                  </button>
                ))}
              </div>

              {/* Stage 2 Synchronous Countdown Trigger */}
              {currentStage === 2 && !isRecording && (
                <button
                  onClick={startEchoSyncCountdown}
                  className="px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-bold bg-accent-600 hover:bg-accent-700 text-white shadow-lg shadow-accent-600/20 flex items-center gap-2 transition"
                >

                  <span>倒數同步出聲跟讀 (3-2-1)</span>

              {/* Recording Toggle Button (Stage 2 or 3) */}
              {!isRecording ? (
                <button
                  onClick={startMicrophoneRecording}
                  className="px-5 py-2.5 rounded-2xl text-xs sm:text-sm font-bold bg-red-600 hover:bg-red-700 text-white shadow-lg shadow-red-600/20 flex items-center gap-2 transition"

                </button>

                <button
                  onClick={stopMicrophoneRecording}
                  className="px-6 py-2.5 rounded-2xl text-xs sm:text-sm font-bold bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-xl flex items-center gap-2 transition animate-pulse"
                >
                  <Icon name="stop" className="w-4 h-4" />
                  <span>停止錄音並產出對比</span>

            {/* Side-by-Side Audio Comparison Player & AI Accuracy Score */}
            {recordedAudioUrl && (
              <div className="p-5 sm:p-6 rounded-3xl bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📊</span>
                    <div>
                      <h4 className="text-sm font-bold text-slate-900 dark:text-white">跟讀成果對比分析 (Native vs Me)</h4>
                      <p className="text-xs text-slate-500">反覆聆聽原音與自己的錄音，檢驗連音與停頓節奏</p>
                    </div>
                  </div>

                  {speechAccuracy !== null && (
                    <div className="flex items-center gap-2 px-3 py-1.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
                      <span className="text-xs font-medium text-slate-500">發音匹配度:</span>
                      <span className={`text-base font-black font-display ${speechAccuracy >= 80 ? 'text-emerald-500' : 'text-amber-500'}`}>
                        {speechAccuracy}% {speechAccuracy >= 80 ? '🎉 漂亮！' : '💪 繼續精進'}
                      </span>
                    </div>
                  )}

                {/* Dual Audio Track Buttons */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button

                    className="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-brand-500 text-left flex items-center justify-between group transition"
                  >
                    <div>
                      <span className="text-[10px] font-bold text-brand-600 uppercase tracking-wider block">Track 1</span>

                    </div>

                  >

                      <span className="text-[10px] font-bold text-red-600 uppercase tracking-wider block">Track 2</span>
                      <span className="text-xs font-bold text-slate-800 dark:text-slate-200">
                        {isPlayingUserAudio ? "🔊 我的錄音播放中..." : "▶️ 聆聽我的錄音 (My Voice)"}
                      </span>

                  </button>

                {/* Speech Recognition Transcript feedback */}

                    <span className="text-[10px] font-bold text-slate-400 uppercase">語音辨識抓取到的字句：</span>
                    <p className="font-mono text-slate-800 dark:text-slate-200 font-semibold">"{recognizedText}"</p>
                  </div>
                )}

            {/* Daily Shadowing Counter status */}

    }

    // =========================================================================
    // 模組三：智慧複習系統 (Smart Review & SRS & 恐慌測驗)
    // =========================================================================
    function ModuleReview({ allChunks, userState, setUserState, onStartShadowing, settings }) {
      const [reviewMode, setReviewMode] = useState('flashcards'); // 'flashcards' | 'quiz' | 'stuckBank'
      
      // SRS Flashcard State
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // Quiz State
      const quizzes = window.ECHOMIND_DATA?.panicQuizzes || [];
      const [quizIndex, setQuizIndex] = useState(0);
      const [selectedOptionId, setSelectedOptionId] = useState(null);
      const [timeLeft, setTimeLeft] = useState(6);
      const [quizAnswered, setQuizAnswered] = useState(false);
      const quizTimerRef = useRef(null);

      // Active card in flashcards
      const activeCard = allChunks[currentIndex % allChunks.length];

      // Handle SRS rating: 1 (完全卡住), 2 (還可以), 3 (熟練掌握), 4 (完美秒殺)
      const handleRateCard = (quality) => {
        const chunkId = activeCard.id;
        const intervalMap = { 1: 1, 2: 3, 3: 7, 4: 15 };
        const intervalDays = intervalMap[quality] || 1;

        setUserState(prev => {
          const isStuck = quality === 1;
          const updatedStuck = isStuck
            ? [...new Set([...prev.stuckChunkIds, chunkId])]
            : prev.stuckChunkIds.filter(id => id !== chunkId);

          return {
            ...prev,
            stuckChunkIds: updatedStuck,
            srsCards: {
              ...prev.srsCards,
              [chunkId]: {
                intervalDays,
                lastReviewed: new Date().toISOString(),
                quality
              }
            }
          };
        });

        // Next card
        setIsFlipped(false);
        setCurrentIndex(i => (i + 1) % allChunks.length);
      };

      // Quiz Countdown Logic
      useEffect(() => {
        if (reviewMode !== 'quiz' || quizAnswered) return;

        const currentQuiz = quizzes[quizIndex];
        if (currentQuiz?.audioText && settings.autoPlayAudio) {
          AudioService.speak(currentQuiz.audioText, { rate: 1.1, lang: settings.accent });
        }

        setTimeLeft(currentQuiz?.timeLimit || 6);
        if (quizTimerRef.current) clearInterval(quizTimerRef.current);

        quizTimerRef.current = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 1) {
              clearInterval(quizTimerRef.current);
              setQuizAnswered(true);
              return 0;
            }
            return t - 1;
          });
        }, 1000);

        return () => {
          if (quizTimerRef.current) clearInterval(quizTimerRef.current);
        };
      }, [quizIndex, reviewMode]);

      const handleSelectQuizOption = (optId) => {
        if (quizAnswered) return;
        if (quizTimerRef.current) clearInterval(quizTimerRef.current);
        setSelectedOptionId(optId);
        setQuizAnswered(true);
      };

      const handleNextQuiz = () => {
        setSelectedOptionId(null);
        setQuizAnswered(false);

    // =========================================================================
    // 模組四：情境 Role-Play 實戰考驗 (No-Panic Survival)
    // =========================================================================
    function ModuleRolePlay({ scenarios, settings, userState, setUserState }) {
      const [selectedScenarioIndex, setSelectedScenarioIndex] = useState(0);
      const activeScenario = scenarios[selectedScenarioIndex] || scenarios[0];

      const [messages, setMessages] = useState(() => [
        {
          id: 'init-msg',
          sender: 'ai',
          text: activeScenario.initialMessage,
          feedback: null
        }
      ]);

      const [inputText, setInputText] = useState('');
      const [isRecognizingVoice, setIsRecognizingVoice] = useState(false);
      const chatEndRef = useRef(null);

      // Auto scroll chat
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // When scenario changes, reset messages
      useEffect(() => {
        setMessages([
          {
            id: 'init-' + Date.now(),
            sender: 'ai',
            text: activeScenario.initialMessage,
            feedback: null
          }
        ]);
        if (settings.autoPlayAudio) {
          AudioService.speak(activeScenario.initialMessage, { rate: 1.1, lang: settings.accent });
        }
      }, [selectedScenarioIndex]);

      // Send User Message & Trigger AI Response
      const handleSendMessage = (textToSend = inputText) => {
        if (!textToSend.trim()) return;

        const userMsg = {
          id: 'user-' + Date.now(),
          sender: 'user',
          text: textToSend.trim()
        };

        setMessages(prev => [...prev, userMsg]);
        setInputText('');

        // Find AI response matching keywords or default
        setTimeout(() => {
          let matched = null;
          const lower = textToSend.toLowerCase();

          for (const rule of activeScenario.aiResponses) {
            if (rule.keywords.some(kw => lower.includes(kw))) {
              matched = rule;
              break;
            }
          }

          if (!matched) {
            matched = {
              response: "Got it! That makes total sense. Thanks for clarifying that up on the fly!",
              feedback: "順暢過關！你保持了冷靜並及時輸出回應，沒有中斷對話。"
            };
          }

          const aiMsg = {
            id: 'ai-' + Date.now(),
            sender: 'ai',
            text: matched.response,
            feedback: matched.feedback
          };

          setMessages(prev => [...prev, aiMsg]);
          if (settings.autoPlayAudio) {
            AudioService.speak(matched.response, { rate: 1.05, lang: settings.accent });
          }
        }, 800);
      };

      // Voice Input via Speech Recognition
      const handleToggleVoiceInput = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('您的瀏覽器不支援 Web Speech 語音輸入，請直接打字。');
          return;
        }

        if (isRecognizingVoice) {
          setIsRecognizingVoice(false);
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = settings.accent;
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => setIsRecognizingVoice(true);
        recognition.onend = () => setIsRecognizingVoice(false);
        recognition.onerror = () => setIsRecognizingVoice(false);

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          setInputText(transcript);
          handleSendMessage(transcript);
        };

        recognition.start();
      };

      return (
        <div className="space-y-6">
          {/* Header & Scenario Selector */}
          <div className="p-4 sm:p-6 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-2xl">{activeScenario.avatar}</span>
                <h2 className="text-lg sm:text-xl font-display font-black text-slate-900 dark:text-white">
                  {activeScenario.title}
                </h2>
              </div>
              <p className="text-xs text-slate-500">
                對話角色: <strong className="text-slate-800 dark:text-slate-200">{activeScenario.role}</strong> • {activeScenario.description}
              </p>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-xs font-semibold text-slate-400">切換劇本:</span>
              <div className="flex items-center gap-1.5">
                {scenarios.map((sc, idx) => (
                  <button
                    key={sc.id}
                    onClick={() => setSelectedScenarioIndex(idx)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                      selectedScenarioIndex === idx
                        ? 'bg-brand-600 text-white shadow-sm'
                        : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
                    }`}
                  >
                    劇本 {idx + 1}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Interactive Chat Window */}
          <div className="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden flex flex-col h-[520px]">
            {/* Messages Body */}
            <div className="flex-1 p-4 sm:p-6 overflow-y-auto space-y-4">
              {messages.map(msg => (
                <div
                  key={msg.id}
                  className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}
                >
                  <div className={`max-w-[85%] sm:max-w-[75%] p-4 rounded-3xl text-xs sm:text-sm ${
                    msg.sender === 'user'
                      ? 'bg-brand-600 text-white rounded-br-none shadow-md shadow-brand-500/10'
                      : 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-bl-none'
                  }`}>
                    <p className="leading-relaxed">{msg.text}</p>
                    {msg.sender === 'ai' && (
                      <div className="mt-2 pt-2 border-t border-slate-200/50 dark:border-slate-700/50 flex items-center justify-between">
                        <button
                          onClick={() => AudioService.speak(msg.text, { rate: 1.05, lang: settings.accent })}
                          className="text-[11px] text-brand-600 dark:text-brand-400 font-bold hover:underline flex items-center gap-1"
                        >
                          <Icon name="volume2" className="w-3.5 h-3.5" />
                          <span>重聽語音</span>
                        </button>
                      </div>
                    )}
                  </div>

                  {/* AI Psychological & Tactical Feedback */}
                  {msg.feedback && (
                    <div className="mt-1 max-w-[85%] text-[11px] text-emerald-600 dark:text-emerald-400 font-medium px-2 flex items-center gap-1">
                      <Icon name="sparkles" className="w-3 h-3 flex-shrink-0" />
                      <span>{msg.feedback}</span>
                    </div>
                  )}
                </div>
              ))}
              <div ref={chatEndRef} />
            </div>

            {/* Pinned Survival Kit Shortcuts (免恐慌生存工具包) */}
            <div className="bg-slate-50 dark:bg-slate-950/80 p-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
              <div className="flex items-center justify-between text-[11px] font-bold text-slate-400">
                <span className="flex items-center gap-1 text-brand-600 dark:text-brand-400">
                  <Icon name="shield" className="w-3.5 h-3.5" />
                  <span>免恐慌生存求救錦囊 (點擊直接引用發送):</span>
                </span>
                <span>不當機 • 不消失</span>
              </div>

              <div className="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                {activeScenario.survivalKit.map((item, idx) => (
                  <button
                    key={idx}
                    onClick={() => handleSendMessage(item.text)}
                    className="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:border-brand-500 whitespace-nowrap shadow-xs transition"
                  >
                    <span className="font-bold text-brand-600 mr-1">[{item.label}]</span>
                    <span>{item.text}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Input Bar */}
            <div className="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center gap-2">
              <button
                onClick={handleToggleVoiceInput}
                className={`p-3 rounded-2xl transition ${
                  isRecognizingVoice ? 'bg-red-500 text-white animate-pulse' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                }`}
                title="語音直接說 (Web Speech 麥克風辨識)"
              >
                <Icon name="mic" className="w-5 h-5" />
              </button>

              <input
                type="text"
                placeholder="輸入你的英文回應或從上方錦囊選擇..."
                value={inputText}
                onChange={e => setInputText(e.target.value)}

                    安裝 EchoMind 手機 App
                  </h3>
                  <p className="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium">純本地免商店 • 離線隨身跟讀</p>
                </div>
              </div>
              <button onClick={onClose} className="p-1.5 rounded-xl text-slate-400 hover:text-slate-600 text-sm">✕</button>
            </div>

            {/* Quick Install Action (if Chrome supports beforeinstallprompt) */}
            {installPrompt && (
              <div className="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/80 text-center space-y-3">
                <p className="text-xs font-bold text-emerald-900 dark:text-emerald-200">
                  🎉 你的手機瀏覽器支援一鍵直接安裝！
                </p>
                <button
                  onClick={() => {
                    onTriggerInstall();
                    onClose();
                  }}
                  className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm shadow-lg shadow-emerald-600/30 transition transform active:scale-95 flex items-center justify-center gap-2"
                >
                  <span>📲</span>
                  <span>立即加到手機桌面</span>
                </button>
              </div>
            )}

            {/* Step by Step Guide for Android Chrome / iOS */}
            <div className="space-y-3 text-xs text-slate-600 dark:text-slate-300">
              <p className="font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
                <span>📌</span>
                <span>手機 Chrome / Safari 安裝步驟：</span>
              </p>

              {isIOS ? (
                <ol className="space-y-2.5 pl-4 list-decimal marker:text-emerald-500 marker:font-bold">
                  <li>點擊 Safari 底部工具列正中央的「<strong>分享</strong>」圖示（帶箭頭的方框）。</li>
                  <li>在選單中往下滑動，找到並點擊「<strong>加入主畫面</strong>」。</li>
                  <li>確認名稱後點擊右上角「<strong>新增</strong>」，可愛的柴犬 EchoMind 圖示就會出現在手機桌面！</li>
                </ol>
              ) : (
                <ol className="space-y-2.5 pl-4 list-decimal marker:text-emerald-500 marker:font-bold">
                  <li>在手機 Chrome 瀏覽器右上角點擊「<strong>三個點選單 (⋮)</strong>」。</li>
                  <li>在展開的選單中點選「<strong>加到主畫面</strong>」或「<strong>安裝應用程式</strong>」。</li>
                  <li>在確認對話框中點擊「<strong>安裝</strong>」，系統會自動將可愛柴犬圖示的 EchoMind 加入桌面！</li>
                </ol>
              )}
            </div>

            <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800 text-[11px] text-slate-500 dark:text-slate-400">
              💡 安裝後打開即為全螢幕沉浸式 App，沒有瀏覽器網址列干擾，語音跟讀與離線複習更加流暢！
            </div>

            <div className="pt-2">
              <button
                onClick={onClose}
                className="w-full py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs transition"
              >
                我知道了，關閉
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Resilient Error Boundary ---
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error('EchoMind Error caught:', error, errorInfo);
      }

      handleResetCache = () => {
        try {
          localStorage.removeItem('echomind_user_state');
          localStorage.removeItem('echomind_settings');
          localStorage.removeItem('echomind_theme');
          if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(r => r.unregister());
            });
          }
        } catch (e) {
          console.error(e);
        }
        window.location.reload(true);
      };

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex items-center justify-center p-4">
              <div className="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                <img src="./assets/icon-192.png" alt="EchoMind" className="w-20 h-20 mx-auto rounded-2xl shadow-lg border-2 border-emerald-500/30" />
                <h2 className="text-xl font-bold">載入時遇到狀況</h2>
                <p className="text-xs text-slate-400">可能是舊版本快取或暫存資料衝突，點擊下方進行一鍵自我修復：</p>
                <div className="text-left bg-slate-950/80 p-3 rounded-xl border border-slate-800 text-[11px] text-red-400 font-mono overflow-auto max-h-24">
                  {this.state.error?.message || '未知錯誤'}
                </div>
                <button
                  onClick={() => window.location.reload()}
                  className="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs transition"
                >
                  一般重新整理
                </button>
                <button
                  onClick={this.handleResetCache}
                  className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold text-xs border border-amber-500/30 transition"
                >
                  ⚡ 一鍵清除快取並修復重啟
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- Mount App ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
